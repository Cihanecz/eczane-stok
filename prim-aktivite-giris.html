<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktivite Girişi · Cihan Eczanesi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root{
    --ana:#2B78C8; --ana2:#1b5aa0;
    --bg:#eef3f8; --kart:#ffffff; --yazi:#13233a; --soluk:#6b7c93;
    --cizgi:#dbe5f0; --golge:0 8px 24px rgba(20,50,90,.10);
    --servis:#2B78C8; --kulak:#D3433B; --temizlik:#0F8A5F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="acik"]){
      --bg:#0d1320; --kart:#15203200; --kart:#152032; --yazi:#e8eef7; --soluk:#8fa1ba;
      --cizgi:#243247; --golge:0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--yazi);
    padding:max(14px,env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    max-width:620px; margin:0 auto; min-height:100vh;
  }
  header{display:flex;align-items:center;gap:10px;margin:4px 2px 16px}
  header .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ana),var(--ana2));
    display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:var(--golge)}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
  header .alt{font-size:12px;color:var(--soluk);margin-top:1px}

  .baslik{font-size:15px;font-weight:700;margin:2px 4px 10px;color:var(--soluk)}

  /* kişi seçimi */
  .kisiler{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .kisi{
    background:var(--kart);border:1.5px solid var(--cizgi);border-radius:18px;
    padding:22px 12px;font-size:20px;font-weight:800;color:var(--yazi);
    display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
    box-shadow:var(--golge);transition:transform .08s, border-color .15s;
  }
  .kisi:active{transform:scale(.96)}
  .kisi .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    font-size:24px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ana),var(--ana2))}

  /* aktivite ekranı */
  .ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ust .selam{font-size:19px;font-weight:800}
  .geri{background:none;border:1.5px solid var(--cizgi);color:var(--soluk);
    border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .geri:active{transform:scale(.96)}

  .aktifler{display:grid;gap:12px}
  .akt{
    display:flex;align-items:center;gap:16px;background:var(--kart);
    border:1.5px solid var(--cizgi);border-radius:18px;padding:16px 18px;cursor:pointer;
    box-shadow:var(--golge);transition:transform .08s;
  }
  .akt:active{transform:scale(.98)}
  .akt .ikon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;flex:0 0 auto}
  .akt .ad{font-size:20px;font-weight:800}
  .akt .bugun{font-size:12.5px;color:var(--soluk);margin-top:2px}
  .akt .arti{margin-left:auto;font-size:30px;font-weight:800;color:var(--soluk);opacity:.5}

  /* feed */
  .feed-bas{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 10px}
  .feed-bas h2{font-size:14px;margin:0;color:var(--soluk);font-weight:700}
  .feed{display:flex;flex-direction:column;gap:8px}
  .satir{display:flex;align-items:center;gap:11px;background:var(--kart);border:1px solid var(--cizgi);
    border-radius:13px;padding:10px 13px;font-size:14px}
  .satir .nokta{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff;flex:0 0 auto}
  .satir .kim{font-weight:700}
  .satir .ne{color:var(--soluk)}
  .satir .vakit{margin-left:auto;color:var(--soluk);font-size:12.5px}
  .bos{color:var(--soluk);font-size:13.5px;text-align:center;padding:16px}

  /* toast / undo */
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);
    background:#13233a;color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;transition:transform .25s;max-width:92vw}
  #toast.gor{transform:translateX(-50%) translateY(0)}
  #toast .msg{font-weight:700;font-size:14.5px}
  #toast button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;padding:7px 12px;font-weight:800;cursor:pointer;font-size:13.5px}
  .yukleniyor{text-align:center;color:var(--soluk);padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="logo">✅</div>
  <div>
    <h1>Aktivite Girişi</h1>
    <div class="alt">Cihan Eczanesi · servis · kulak · temizlik</div>
  </div>
</header>

<div id="ekran"><div class="yukleniyor">Yükleniyor…</div></div>

<div class="feed-bas"><h2>📋 Bugün girilenler</h2></div>
<div id="feed" class="feed"></div>

<div id="toast"><span class="msg"></span><button id="geriAl">Geri al</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  const SB_URL="https://crgfvsfncazexynzhwmo.supabase.co";
  const SB_KEY="sb_publishable_WqWzwvumk9pMhBoV6LeMMA_tEgvzbPw";
  const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});

  const TURLER={
    servis:  {ad:"Servis",   ikon:"🛵", renk:"var(--servis)"},
    kulak:   {ad:"Kulak",    ikon:"👂", renk:"var(--kulak)"},
    temizlik:{ad:"Temizlik", ikon:"🧹", renk:"var(--temizlik)"}
  };
  const $=s=>document.querySelector(s);
  const kacis=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const bugunLocal=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
  const saat=t=>{try{return new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}};
  const basHarf=a=>(a||"?").trim().charAt(0).toLocaleUpperCase("tr");

  let personeller=[], seciliKisi=null, bugunKayit=[];

  async function veriYukle(){
    try{
      const [p,a]=await Promise.all([
        db.from("prim_personel").select("ad,sira,aktif").eq("aktif",true).order("sira"),
        db.from("prim_aktivite").select("id,personel,tur,olusturma").eq("tarih",bugunLocal()).order("olusturma",{ascending:false}).limit(60)
      ]);
      if(p.error) throw p.error;
      personeller=(p.data||[]);
      bugunKayit=(a.data||[]);
    }catch(e){
      $("#ekran").innerHTML='<div class="bos">Bağlantı kurulamadı. İnternet var mı? Sayfayı yenileyin.</div>';
      return;
    }
    if(seciliKisi) aktiviteEkrani(); else kisiEkrani();
    feedCiz();
  }

  function kisiEkrani(){
    seciliKisi=null;
    if(!personeller.length){ $("#ekran").innerHTML='<div class="bos">Personel tanımlı değil.</div>'; return; }
    const kartlar=personeller.map(p=>`
      <button class="kisi" onclick="PRIM.sec('${kacis(p.ad)}')">
        <span class="avatar">${kacis(basHarf(p.ad))}</span>${kacis(p.ad)}
      </button>`).join("");
    $("#ekran").innerHTML=`<div class="baslik">Kim giriyor?</div><div class="kisiler">${kartlar}</div>`;
  }

  function benimBugun(tur){
    return bugunKayit.filter(k=>k.personel===seciliKisi && k.tur===tur).length;
  }
  function aktiviteEkrani(){
    const kart=Object.keys(TURLER).map(t=>{
      const T=TURLER[t], say=benimBugun(t);
      return `<button class="akt" onclick="PRIM.ekle('${t}')">
        <span class="ikon" style="background:${T.renk}">${T.ikon}</span>
        <span><span class="ad">${T.ad}</span><div class="bugun">bugün ${say} kez</div></span>
        <span class="arti">＋</span>
      </button>`;
    }).join("");
    $("#ekran").innerHTML=`
      <div class="ust">
        <div class="selam">Merhaba ${kacis(seciliKisi)} 👋</div>
        <button class="geri" onclick="PRIM.kisiDegis()">◀ Kişi değiştir</button>
      </div>
      <div class="baslik">Ne yaptın? (dokun → eklenir)</div>
      <div class="aktifler">${kart}</div>`;
  }

  function feedCiz(){
    if(!bugunKayit.length){ $("#feed").innerHTML='<div class="bos">Bugün henüz giriş yok.</div>'; return; }
    $("#feed").innerHTML=bugunKayit.slice(0,30).map(k=>{
      const T=TURLER[k.tur]||{ad:k.tur,ikon:"•",renk:"#888"};
      return `<div class="satir">
        <span class="nokta" style="background:${T.renk}">${T.ikon}</span>
        <span class="kim">${kacis(k.personel)}</span><span class="ne">${T.ad}</span>
        <span class="vakit">${saat(k.olusturma)}</span>
      </div>`;
    }).join("");
  }

  let toastZaman=null, sonEklenenId=null;
  function toastGoster(msg, undo){
    clearTimeout(toastZaman);
    $("#toast .msg").textContent=msg;
    $("#geriAl").style.display=undo?"":"none";
    $("#toast").classList.add("gor");
    toastZaman=setTimeout(()=>$("#toast").classList.remove("gor"), undo?5000:2200);
  }

  const PRIM={
    sec(ad){ seciliKisi=ad; aktiviteEkrani(); },
    kisiDegis(){ kisiEkrani(); },
    async ekle(tur){
      const kisi=seciliKisi; if(!kisi) return;
      const T=TURLER[tur];
      // iyimser: hemen göster
      toastGoster("✓ "+T.ad+" eklendi — "+kisi, true);
      try{
        const {data,error}=await db.from("prim_aktivite")
          .insert({personel:kisi, tur, adet:1, tarih:bugunLocal()}).select("id,personel,tur,olusturma").single();
        if(error) throw error;
        sonEklenenId=data.id;
        bugunKayit.unshift(data);
        if(seciliKisi===kisi) aktiviteEkrani();
        feedCiz();
      }catch(e){
        toastGoster("⚠ Kaydedilemedi, tekrar dene", false);
      }
    },
    async geriAl(){
      if(!sonEklenenId) return;
      const id=sonEklenenId; sonEklenenId=null;
      try{
        await db.from("prim_aktivite").delete().eq("id",id);
        bugunKayit=bugunKayit.filter(k=>k.id!==id);
        if(seciliKisi) aktiviteEkrani();
        feedCiz();
        toastGoster("↩ Geri alındı", false);
      }catch(e){ toastGoster("⚠ Geri alınamadı", false); }
    }
  };
  window.PRIM=PRIM;
  $("#geriAl").onclick=()=>PRIM.geriAl();

  veriYukle();
  // sayfa görünür olunca tazele (başkası girince güncel kalsın)
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) veriYukle(); });
  setInterval(()=>{ if(!document.hidden && !seciliKisi) veriYukle(); }, 60000);
})();
</script>
</body>
</html>
