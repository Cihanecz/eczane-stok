    const adaylar = [...new Set([o.gtin, o.gtin.replace(/^0/,""), "0"+o.gtin.replace(/^0+/,"")])];
    const { data } = await db.from("urun_ozet").select("barkod").in("barkod", adaylar).limit(1);
    if(!data || !data.length){ alt.innerHTML = `Bu ürün stok listesinde yok <small>(${kacis(o.gtin)})</small> <button type="button" class="sepet-d" id="taraDepo">🏷️ Depolarda ara</button>`;
      const g = o.gtin.replace(/^0(\d{13})$/,"$1"); const td = document.getElementById("taraDepo"); if(td) td.onclick = ()=>{ kapat(); location.hash = "depoara/"+g; };
      continue; }
    if(navigator.vibrate) navigator.vibrate(60);
    SON_OKUTMA = { ...o, barkod: data[0].barkod, zaman: Date.now() };
    kapat(); const hedef = "urun/" + data[0].barkod;
    if(decodeURIComponent(location.hash.slice(1))===hedef) yonlendir(); else location.hash = hedef;
    return;
  }
}
$("#taraDugme").addEventListener("click", taramaAc);
/* ---------- depo sepetine ekle (telefondan) ----------
   istek ayar.sepet_istek'e yazılır; eczane bilgisayarındaki gözcü 15 sn içinde görür, Chrome eklentisi depo ekranında sepete ekler. */
const SEPET_DEPOLAR = ["as","sn","bek"];
let SEPET_SECIM = null;
async function sepetListe(){
  const { data, error } = await db.from("ayar").select("deger").eq("anahtar","sepet_istek").maybeSingle();
  if(error) throw error;
  try { return (data && JSON.parse(data.deger).liste) || []; } catch(e){ return []; }
}
const SEPET_DURUM = { bekliyor:"⏳ eczane bilgisayarına gönderildi", sepette:"✓ sepete eklendi", hata:"✗ eklenemedi" };
async function sepetGecmisi(barkod){
  try { const l = (await sepetListe()).filter(x=>x.tip!=="ara" && x.barkod===barkod && Date.now()-new Date(x.zaman) < 3*864e5).slice(-4).reverse();
    if(!l.length) return "";
    return `<div style="margin-top:8px;font-size:13px">${l.map(x=>`<div style="color:${x.durum==="sepette"?"var(--yesil)":x.durum==="hata"?"var(--kirmizi)":"var(--amber)"}">${DEPO_AD[x.depo]||x.depo} · ${x.m?x.a+"+"+x.m:x.a+" adet"} ×${x.kat} — ${SEPET_DURUM[x.durum]||x.durum}${x.mesaj&&x.durum!=="sepette"?" ("+kacis(x.mesaj)+")":""} <small style="color:var(--soluk)">${tarihSaat(x.zaman)}</small></div>`).join("")}</div>`;
  } catch(e){ return ""; }
}
function sepetAc(depo, barkod, ad, a, m){
  SEPET_SECIM = { depo, barkod, ad, a, m };
  $("#sepetBaslik").textContent = `${DEPO_AD[depo]} sepetine ekle`;
  $("#sepetAciklama").textContent = `${ad} — ${m ? a+"+"+m : "MF'siz"}`;
  $("#sepetKat").value = 1; sepetToplamYaz();
  $("#sepetPerde").classList.remove("gizli"); setTimeout(()=>$("#sepetKat").select(), 50);
}
function sepetToplamYaz(){
  const s = SEPET_SECIM; if(!s) return; const k = Math.max(1, parseInt($("#sepetKat").value||"1",10)||1);
  $("#sepetToplam").textContent = `Depoya ${s.a*k} adet sipariş${s.m ? `, ${s.m*k} adet MF ile toplam ${(s.a+s.m)*k} kutu` : ""}.`;
}
function sepetNot(metin, sure){ let n = $(".sepet-not"); if(!n){ n = document.createElement("div"); n.className = "sepet-not"; document.body.appendChild(n); }
  n.innerHTML = metin; clearTimeout(n._t); if(sure) n._t = setTimeout(()=>n.remove(), sure); }
$("#sepetKat").addEventListener("input", sepetToplamYaz);
$("#sepetVazgec").addEventListener("click", ()=>$("#sepetPerde").classList.add("gizli"));
$("#sepetFormu").addEventListener("submit", async e => {
  e.preventDefault(); const s = SEPET_SECIM; if(!s) return;
  const kat = Math.max(1, Math.min(99, parseInt($("#sepetKat").value||"1",10)||1));
  $("#sepetPerde").classList.add("gizli");
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try {
    const l = await sepetListe();
    l.push({ id, depo:s.depo, barkod:s.barkod, ad:s.ad, a:s.a, m:s.m, kat, adet:s.a*kat, durum:"bekliyor", zaman:new Date().toISOString() });
    const { error } = await db.from("ayar").upsert({ anahtar:"sepet_istek", deger: JSON.stringify({ liste: l.slice(-60) }), guncelleme: new Date().toISOString() }, { onConflict:"anahtar" });
    if(error) throw error;
  } catch(err){ return sepetNot("✗ İstek gönderilemedi: "+kacis(err.message||err), 6000); }
  sepetNot(`⏳ ${DEPO_AD[s.depo]} sepetine ekleniyor… <small style="color:var(--soluk)">(eczane bilgisayarı yaklaşık 1 dk içinde ekler)</small>`);
  for(let i=0;i<48;i++){
    await new Promise(r=>setTimeout(r,5000));
    try { const x = (await sepetListe()).find(y=>y.id===id); if(!x || x.durum==="bekliyor") continue;
      if(x.durum==="sepette") sepetNot(`✓ ${DEPO_AD[s.depo]} sepetine eklendi: ${kacis(s.ad)} ${s.m? (s.a*kat)+"+"+(s.m*kat) : (s.a*kat)+" adet"}`, 8000);
      else sepetNot(`✗ ${DEPO_AD[s.depo]} sepetine eklenemedi: ${kacis(x.mesaj||"")}`, 10000);
      return;
    } catch(err){}
  }
  sepetNot("⏳ Eczane bilgisayarından henüz cevap gelmedi. Bilgisayar ve Chrome açık mı?", 10000);
});

/* ---------- DEPOLARDA ARA: ad ya da barkodla bütün depolarda arar (elde olmayan ürünler dahil) ----------
   istek ayar.sepet_istek listesine {tip:"ara"} olarak yazılır; eczane bilgisayarı depolarda arar,
   sonucu depo depo ayar.depo_ara_sonuc'a yazar. Sadece okur; sepete eklemek için 🛒'a basılır. */
let DEPO_ARA_NO = 0;
async function depoAraSonucOku(id){
  const { data } = await db.from("ayar").select("deger").eq("anahtar","depo_ara_sonuc").maybeSingle();
  try { return ((data && JSON.parse(data.deger).liste) || []).find(x=>x.id===id) || null; } catch(e){ return null; }
}
const DA_DURUM = {
  giris: k => `${DEPO_AD[k]} oturumu kapalı — eczane bilgisayarındaki Chrome'da ${DEPO_AD[k]} sitesine bir kez giriş yapın.`,
  dogrulama: k => `${DEPO_AD[k]} robot doğrulaması istiyor — eczane bilgisayarındaki Chrome'da ${DEPO_AD[k]} sekmesini açıp kutuyu işaretleyin.`,
  eklenti_yok: k => `${DEPO_AD[k]} sitesine ulaşılamadı — eczane bilgisayarında Chrome kapalı ya da Depo Köprüsü eklentisi güncel değil.`,
  hata: k => `${DEPO_AD[k]}'ta hata oluştu.` };
function depoAraCiz(s, q){
  const barkodla = /^\d{8,14}$/.test(q);
  const sira = (s.sira && s.sira.length) ? s.sira : Object.keys(s.depolar||{});
  const blok = k => {
    const d = (s.depolar||{})[k];
    if(!d) return `<div class="da-blok"><h2>${DEPO_AD[k]||k}</h2><div style="color:var(--soluk)">⏳ aranıyor…</div></div>`;
    if(d.durum!=="ok") return `<div class="da-blok"><h2>${DEPO_AD[k]||k}</h2><div style="color:var(--amber)">⚠️ ${kacis((DA_DURUM[d.durum]||DA_DURUM.hata)(k))}${d.mesaj?` <small style="color:var(--soluk)">(${kacis(d.mesaj)})</small>`:""}</div></div>`;
    const u = d.u || [];
    if(!u.length) return `<div class="da-blok"><h2>⚪ ${DEPO_AD[k]||k}</h2><div style="color:var(--soluk)">${barkodla?"Bu barkodla bu depoda kaydı yok.":"Bu adla bu depoda ürün bulunamadı."}</div></div>`;
    const varSay = u.filter(x=>x.s!==0).length;
    return `<div class="da-blok"><h2>${u.some(x=>x.s===1)?"🟢":varSay?"🔵":"🔴"} ${DEPO_AD[k]||k} <small style="font-weight:400;color:var(--soluk)">· ${u.length} ürün${u.length>varSay?`, ${u.length-varSay} tanesi stokta yok`:""}</small></h2>
      ${u.map((x,i)=>{ const kd = x.k!=null ? Number(x.k) : 10; const sec = depoSecenekler(x);
        const ben = (s.benim||{})[String(x.b||"").replace(/^0(\d{13})$/,"$1")];
        return `<div class="da-urun"><b>${kacis(x.ad||x.b||"?")}</b>${x.b?` <small style="color:var(--soluk)">${kacis(x.b)}</small>`:""}
          ${x.s===0?' <span style="color:var(--kirmizi);font-size:13px">· kayıtlı ama stokta yok</span>':x.s===1?' <span style="color:var(--yesil);font-size:13px">· stokta var</span>':' <span style="color:var(--soluk);font-size:13px">· stok bilgisi gelmedi</span>'}
          ${ben?`<small style="display:block;color:var(--soluk)">Sende ${sayi(ben.stok)} kutu · ayda ~${sayi((ben.adet_90||0)/3)} satıyor</small>`:""}
          ${sec.map(o=>`<div style="padding:2px 0;white-space:nowrap;font-size:14px">${secenekAd(o)} → tanesi <b>${para(o.n*(1+kd/100))}</b> <small style="color:var(--soluk)">KDV dahil${o.v!=null?` · ${o.v} gün`:""}</small>${x.b && SEPET_DEPOLAR.includes(k)?`<button class="sepet-d" type="button" data-dasepet="${k}|${i}|${o.a}|${o.m||0}" title="Depo sepetine ekle">🛒</button>`:""}</div>`).join("") || `<small style="color:var(--soluk)">fiyat yok</small>`}</div>`; }).join("")}</div>`;
  };
  $("#daSonuc").innerHTML = sira.map(blok).join("") + `<p class="alt-not">Fiyatlar depo ekranındaki net fiyattır (MF ve iskonto dahil). Sipariş vermeden önce depo ekranından teyit edin.</p>`;
  document.querySelectorAll("[data-dasepet]").forEach(b=>b.addEventListener("click", ()=>{
    const [k,i,a,m] = b.dataset.dasepet.split("|"); const x = s.depolar[k].u[+i];
    sepetAc(k, String(x.b).replace(/^0(\d{13})$/,"$1"), x.ad||x.b, +a, +m); }));
}
async function depoAraSayfasi(q){
  const no = ++DEPO_ARA_NO;
  $("#depoDugme").classList.remove("aktif"); $("#hastaDugme").classList.remove("aktif");
  $("#icerik").innerHTML = `<button class="geri" type="button" onclick="history.length>1?history.back():location.hash=''">‹ Geri</button>
    <div class="liste-ust"><div><h1>Depolarda: “${kacis(q)}”</h1><p id="daDurum">⏳ Eczane bilgisayarına soruluyor… genelde 30 sn – 1 dk sürer.</p></div></div>
    <div id="daSonuc"></div>`;
  const id = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try {
    const l = await sepetListe();
    l.push({ id, tip:"ara", q, durum:"bekliyor", zaman:new Date().toISOString() });
    const { error } = await db.from("ayar").upsert({ anahtar:"sepet_istek", deger: JSON.stringify({ liste: l.slice(-60) }), guncelleme: new Date().toISOString() }, { onConflict:"anahtar" });
    if(error) throw error;
  } catch(err){ $("#daDurum").textContent = "✗ İstek gönderilemedi: " + (err.message||err); return; }
  let benim = null;
  for(let i=0;i<80;i++){
    await new Promise(r=>setTimeout(r,3000));
    if(no!==DEPO_ARA_NO || !decodeURIComponent(location.hash).startsWith("#depoara/")) return;
    let s; try { s = await depoAraSonucOku(id); } catch(e){ continue; }
    if(!s) continue;
    const bl = [...new Set(Object.values(s.depolar||{}).flatMap(d=>(d.u||[]).map(x=>String(x.b||"").replace(/^0(\d{13})$/,"$1"))).filter(b=>/^\d{8,14}$/.test(b)))];
    if(!benim || bl.some(b=>!(b in benim))){ benim = benim || {}; for(const b of bl) if(!(b in benim)) benim[b] = null;
      try { const { data } = await db.from("urun_ozet").select("barkod,stok,adet_90").in("barkod", [...bl, ...bl.map(b=>"0"+b)]); for(const r of data||[]) benim[r.barkod.replace(/^0(\d{13})$/,"$1")] = r; } catch(e){} }
    s.benim = benim; depoAraCiz(s, q);
    if(s.bitti){ $("#daDurum").textContent = `${tarihSaat(s.zaman)} itibarıyla depo ekranlarından alındı.`; return; }
    $("#daDurum").textContent = "⏳ Diğer depolar aranıyor…";
  }
  $("#daDurum").textContent = "⏳ Eczane bilgisayarından cevap gelmedi. Bilgisayar ve Chrome açık mı?";
}

// program açılınca: şifre bu oturumda girildiyse rozeti arka planda güncelle

  if(!hAnahtarYukle()) return;
