<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eczane Stok</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F5; --yuzey:#FFFFFF; --yuzey2:#F6F9F8; --murekkep:#1C2B33; --soluk:#66767E; --cizgi:#E0E7E4; --hover:#EEF4F1;
  --yesil:#0F8A5F; --yesil-koyu:#B9DFCD; --yesil-acik:#E7F5EE; --amber:#B26A00; --amber-acik:#FFF3DF;
  --kirmizi:#D3433B; --kirmizi-acik:#FDECEB; --mavi:#2B78C8; --mor:#7A52C4; --odak:#2B78C8; --giris:#EAF2EE;
  --golge:0 1px 2px rgba(20,40,32,.06),0 2px 8px rgba(20,40,32,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
html{color-scheme:light}
/* açılış görseli + dokunma/geçiş animasyonları */
.acilis{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(150deg,#12A06E,#0b6e4c);color:#fff}
.acilis.gizli{display:none}
.ac-ic{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.ac-ic svg{width:74px;height:74px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.28))}
.ac-ad{font-size:29px;font-weight:800;letter-spacing:.3px;line-height:1.2;max-width:90vw}
.ac-eczaci{font-size:16px;font-weight:600;opacity:.92;margin-top:-6px;max-width:90vw}
.ac-eczaci:empty{display:none}
.ac-alt{font-size:13px;opacity:.85;letter-spacing:3px;text-transform:uppercase}
.acilis:not(.gizli){opacity:1}
.ac-gir .ac-ic{animation:acIc .7s cubic-bezier(.2,.8,.2,1)}
.ac-cik{animation:acFadeOut .5s ease forwards}
@keyframes acFadeIn{from{opacity:0}to{opacity:1}}
@keyframes acFadeOut{to{opacity:0}}
@keyframes acIc{0%{opacity:0;transform:translateY(16px) scale(.95)}100%{opacity:1;transform:none}}
#icerik.gir{animation:icerikGir .22s ease}
@keyframes icerikGir{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
/* basınca içeri çökme hissi */
.kart,.satir,.dl-s,.nv-satir,.ib-kart,.ib-cip,.nv-cip,.ust-dugme,.ana-dugme,.ikincil,.geri,.da-dugme,[data-liste],[data-git]{transition:transform .13s ease}
.kart:active,.satir:active,.dl-s:active,.nv-satir:active,.ib-kart:active,.ib-cip:active,.nv-cip:active,.ust-dugme:active,.ana-dugme:active,.ikincil:active,.geri:active,.da-dugme:active,[data-liste]:active,[data-git]:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.ac-gir,.ac-gir .ac-ic,.ac-cik,#icerik.gir,.ripple{animation:none!important}
  .kart:active,.satir:active,.dl-s:active,.nv-satir:active,.ib-kart:active,.ib-cip:active,.nv-cip:active,.ust-dugme:active,.ana-dugme:active,.ikincil:active,.geri:active,.da-dugme:active,[data-liste]:active,[data-git]:active{transform:none}}
body{background:var(--bg);color:var(--murekkep);font:16px/1.45 "Onest",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--odak);outline-offset:2px}
a{color:inherit}
.gizli{display:none!important}

/* ---------- üst çubuk ---------- */
.ust{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--cizgi);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.ust-ic{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px}
.marka{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;
  background:none;border:0;color:var(--murekkep);cursor:pointer;padding:4px 0}
.marka svg{flex:none}
.ara-kutu{flex:1 1 240px;position:relative;max-width:360px;min-width:190px;margin-left:auto}
.ara-kutu input{width:100%;border:1px solid var(--cizgi);border-radius:12px;padding:10px 14px 10px 40px;font-size:16px;
  background:var(--yuzey);color:var(--murekkep)}
.ara-kutu input::placeholder{color:var(--soluk)}
.ara-kutu svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soluk)}
.ara-kutu input{padding-right:48px}
@media (max-width:640px){body[data-ekran="ilacbul"] .ara-kutu,body[data-ekran="neverelim"] .ara-kutu{display:none}}
.tara-dugme{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:var(--yesil-acik);border:1px solid var(--yesil-koyu);color:var(--yesil);border-radius:9px;width:38px;height:32px;font-size:17px;cursor:pointer;display:grid;place-items:center}
.tarayici{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.tarayici video{flex:1;width:100%;object-fit:cover;min-height:0}
.tarayici .cerceve{position:absolute;left:50%;top:45%;width:min(64vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--yesil);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.tarayici .t-ust{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;font-weight:600}
.tarayici .t-ust button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 14px;font-size:15px}
.tarayici .t-alt{position:absolute;bottom:0;left:0;right:0;padding:16px 16px 26px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:15px}
.dl{display:flex;flex-direction:column;gap:10px}
.dl-s{display:block;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:12px 16px;cursor:pointer;box-shadow:var(--golge)}
.dl-s:hover{border-color:var(--yesil-koyu);background:var(--hover)}
.dl-ust{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.dl-ad{font-weight:600;font-size:15px}
.dl-meta{font-size:13px;color:var(--soluk);white-space:nowrap}
.dl-oneri{margin-top:6px;font-size:14px;line-height:1.45}
.gebelik{display:block;margin-top:3px;font-size:12.5px;line-height:1.35;color:var(--mor)}
.gebelik b{font-weight:800}
.gebelik .gb-ac{color:var(--soluk);font-weight:400}
.gebelik-k{font-size:11.5px;color:var(--mor)}
.gebelik-k b{font-weight:800}
.dl-fiyat{margin-top:4px;font-size:12.5px;color:var(--soluk)}
.dl-fiyat b{color:var(--murekkep);font-weight:600}
.da-dugme{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--yesil-acik);border:1px solid var(--yesil-koyu);color:var(--yesil);border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:15px;font-weight:600;cursor:pointer}
.da-dugme small{font-weight:400;color:var(--soluk)}
.da-blok{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.da-blok h2{margin:0 0 8px;font-size:17px}
.da-urun{padding:8px 0;border-top:1px solid var(--cizgi)}
.da-urun:first-of-type{border-top:0}
.mf-h{font-size:13px;line-height:1.45;padding:3px 0}
.sepet-d{background:var(--yesil-acik);border:1px solid var(--yesil-koyu);color:var(--yesil);border-radius:8px;padding:2px 8px;margin-left:8px;font-size:13px;cursor:pointer;vertical-align:middle}
.sepet-not{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:12px;padding:11px 16px;font-size:14px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.okutma{border:1px solid var(--yesil-koyu);background:var(--yesil-acik);border-radius:14px;padding:10px 14px;margin:6px 0 12px;font-size:14px}
.okutma.yakin{border-color:var(--kirmizi);background:var(--kirmizi-acik)}
.okutma.orta{border-color:var(--amber);background:var(--amber-acik)}
.ust-dugme{background:var(--yuzey);border:1px solid var(--cizgi);color:var(--murekkep);border-radius:11px;padding:7px 10px;font-size:14px;
  cursor:pointer;white-space:nowrap}
.ust-dugme:hover{background:var(--hover)}

.sayfa{max-width:1180px;margin:0 auto;padding:20px 16px 56px}

/* ---------- giriş ---------- */
.giris{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.giris form{width:100%;max-width:360px;background:var(--yuzey);border-radius:18px;padding:28px 24px;border:1px solid var(--cizgi)}
.giris h1{margin:12px 0 4px;font-size:24px}
.giris p{margin:0 0 20px;color:var(--soluk)}
.alan{display:block;margin-bottom:14px}
.alan span{display:block;font-size:14px;color:var(--soluk);margin-bottom:6px}
.alan input{width:100%;padding:12px 14px;border:1px solid var(--cizgi);border-radius:10px;background:var(--giris)}
.ana-dugme{width:100%;padding:13px;border:0;border-radius:10px;background:var(--yesil);color:#fff;font-weight:700;cursor:pointer}
.ana-dugme:disabled{opacity:.6;cursor:default}
.hata{color:var(--kirmizi);font-size:14px;min-height:20px;margin:4px 0 10px}

/* ---------- tutar kilidi ---------- */
.ust-dugme.kilit{display:inline-flex;align-items:center;gap:5px}
.ust-dugme.kilit.acik{border-color:var(--yesil);color:var(--yesil)}
.kilitli{color:var(--soluk);letter-spacing:2px;cursor:pointer;white-space:nowrap}
.kilitli:hover{color:var(--murekkep)}
.kilit-kart{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kilit-kart p{margin:0;color:var(--soluk);flex:1;min-width:200px}
.perde{position:fixed;inset:0;background:rgba(20,32,28,.45);display:grid;place-items:center;padding:16px;z-index:50}
.perde form{width:100%;max-width:340px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:24px 22px}
.perde h2{margin:0 0 6px;font-size:20px}
.perde p{margin:0 0 16px;color:var(--soluk);font-size:14px}
.perde input{letter-spacing:4px;font-size:18px}
.perde .yan{display:flex;gap:10px;margin-top:10px}
.perde .yan button{flex:1}
.izgara.cift{grid-template-columns:1fr 1fr}
@media (max-width:760px){.izgara.cift{grid-template-columns:1fr}}
@media (max-width:520px){.ek-yazi{display:none}}
/* telefonda üst çubuk iki satır: marka + düğmeler üstte, arama kutusu altta tam genişlik */
@media (max-width:640px){
  .ust-ic{flex-wrap:wrap;gap:8px}
  .ust-ic .marka span{display:inline}
  .ara-kutu{order:9;flex:1 1 100%;max-width:none;margin-left:0}
  #hastaDugme{margin-left:auto}
  .ust-dugme{padding:8px 10px}
}
@media (max-width:430px){ .ust-ic .marka span{display:none} }
.ad-duzenle{background:none;border:0;color:var(--soluk);cursor:pointer;padding:0 4px;font-size:13px}
.ad-duzenle:hover{color:var(--murekkep)}
.metin-dugme{background:none;border:0;color:var(--soluk);text-decoration:underline;cursor:pointer;padding:8px 0 0;font-size:14px}

/* ---------- kartlar ---------- */
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:18px 20px;min-width:0}
.kart-bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kart-bas h2{margin:0;font-size:15px;font-weight:600}
.kart-bas small{color:var(--soluk);font-size:13px}

/* ---------- ana ekran ---------- */
.selam{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.selam h1{margin:0;font-size:26px;letter-spacing:-.01em}
.selam p{margin:2px 0 0;color:var(--soluk);font-size:14px}
.rozet{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--soluk);background:var(--yuzey);
  border:1px solid var(--cizgi);border-radius:999px;padding:6px 12px}
.rozet::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yesil)}
.rozet.uyari{color:var(--amber)} .rozet.uyari::before{background:var(--amber)}
.rozet.kotu{color:var(--kirmizi)} .rozet.kotu::before{background:var(--kirmizi)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi .kart{padding:16px 18px}
.kpi h3{margin:0;font-size:13px;font-weight:500;color:var(--soluk)}
.kpi .deger{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px;white-space:nowrap}
.kpi .not{font-size:13px;color:var(--soluk);margin-top:4px}
.yukari{color:var(--yesil)} .asagi{color:var(--kirmizi)}
.kpi .ana .deger{color:var(--yesil)}

.izgara{display:grid;gap:14px;margin-bottom:14px}
.izgara.ikili{grid-template-columns:1.75fr 1fr}
.izgara.dortlu{grid-template-columns:repeat(4,1fr)}
.izgara.alt{grid-template-columns:1.35fr 1fr}

/* çubuk grafik */
.cizim{width:100%;height:auto;display:block;overflow:visible}
.cizim text{fill:var(--soluk);font-size:11px;font-family:inherit}
.cizim.gunluk{height:150px}
.lejant{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soluk)}
.lejant i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cubuk-g rect.c{fill:var(--yesil-koyu)} .cubuk-g rect.k{fill:var(--yesil)}
.cubuk-g:hover rect.c{fill:#93CDB2}
.alis-cizgi{fill:none;stroke:var(--mavi);stroke-width:2}
.alis-nokta{fill:var(--bg);stroke:var(--mavi);stroke-width:2}
.ozet-uc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--cizgi)}
.ozet-uc span{display:block;font-size:12px;color:var(--soluk)}
.ozet-uc b{font-size:17px}

/* halka grafik */
.halka{display:flex;flex-direction:column;align-items:center;gap:14px}
.halka svg{width:150px;height:150px;flex:none}
.halka svg circle.dilim{transition:opacity .15s;cursor:default}
.halka svg circle.dilim.tik{cursor:pointer}
.halka:has(.lj:hover) circle.dilim{opacity:.35}
.halka svg circle.dilim.vurgu{opacity:1!important}
.halka .merkez-b{font-size:19px;font-weight:700;fill:var(--murekkep)}
.halka .merkez-k{font-size:11px;fill:var(--soluk)}
.lj-liste{width:100%;display:flex;flex-direction:column;gap:2px}
.lj{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 6px;border-radius:8px;
  background:none;border:0;text-align:left;width:100%;color:var(--murekkep)}
.lj i{width:10px;height:10px;border-radius:3px}
.lj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lj b{font-weight:600;white-space:nowrap}
.lj b small{color:var(--soluk);font-weight:400;margin-left:4px}
button.lj{cursor:pointer} button.lj:hover{background:var(--hover)}

.baslik{font-size:15px;font-weight:600;margin:0 0 10px}
.isler{display:flex;flex-direction:column}
.is{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:14px;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--cizgi);padding:13px 4px;cursor:pointer;color:var(--murekkep)}
.is:last-child{border-bottom:0}
.is:hover{background:var(--hover)}
.is .nokta{width:10px;height:10px;border-radius:50%}
.is .ad{font-weight:600}
.is .aciklama{display:block;font-size:13px;color:var(--soluk);font-weight:400}
.is .sayi{font-weight:700;font-size:19px;text-align:right}
.is .tl{color:var(--soluk);font-size:13px;text-align:right;min-width:110px}
.yildiz{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;
  border-bottom:1px solid var(--cizgi);padding:10px 4px;text-align:left;cursor:pointer;color:var(--murekkep)}
.yildiz:last-child{border-bottom:0}
.yildiz:hover{background:var(--hover)}
.yildiz em{font-style:normal;color:var(--soluk);font-size:13px}
.yildiz .ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.yildiz .ad small{display:block;color:var(--soluk);font-size:12px}
.yildiz b{color:var(--yesil);white-space:nowrap}
.bilgi-not{font-size:13px;color:var(--soluk);padding:14px 0 4px}

/* ---------- listeler ---------- */
.geri{background:none;border:0;padding:6px 0;color:var(--yesil);font-weight:600;cursor:pointer;margin-bottom:8px}
.liste-ust{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.liste-ust h1{margin:0;font-size:24px}
.liste-ust p{margin:4px 0 0;color:var(--soluk)}
.ikincil{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px;padding:9px 14px;cursor:pointer}
.ikincil:hover{background:var(--hover)}
.tablo{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;overflow:hidden}
.satir{display:grid;grid-template-columns:1fr repeat(3,minmax(84px,auto));gap:12px;align-items:center;
  padding:12px 18px;border-bottom:1px solid var(--cizgi);width:100%;background:none;border-left:0;border-right:0;border-top:0;
  text-align:left;cursor:pointer;color:var(--murekkep)}
.satir:last-child{border-bottom:0}
.satir:hover{background:var(--hover)}
.satir.bas{cursor:default;font-size:13px;color:var(--soluk);background:var(--yuzey2)}
.satir .s{text-align:right;white-space:nowrap}
.satir .ad{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.satir .kucuk{display:block;font-size:13px;color:var(--soluk);font-weight:400}
.bos{padding:40px 20px;text-align:center;color:var(--soluk)}

/* ---------- ürün kartı ---------- */
.urun-bas h1{margin:0;font-size:26px;line-height:1.2}
.urun-bas p{margin:6px 0 18px;color:var(--soluk)}
.bilgiler{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--cizgi);
  border:1px solid var(--cizgi);border-radius:18px;overflow:hidden;margin-bottom:18px}
.bilgi{background:var(--yuzey);padding:14px 16px}
.bilgi span{display:block;font-size:13px;color:var(--soluk)}
.bilgi b{display:block;font-size:20px;font-weight:600;margin-top:2px}
.bilgi small{color:var(--soluk);font-size:13px}
.kutu-blok{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:var(--golge)}
.alt-not{color:var(--soluk);font-size:14px;margin-top:6px}

/* Raf: her kare bir kutu, miadına göre sıralı */
.raf{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 6px}
.raf i{width:16px;height:22px;border-radius:3px;background:var(--yesil);display:block}
.raf i.yakin{background:var(--kirmizi)}
.raf i.orta{background:var(--amber)}
.raf-not{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--soluk)}
.raf-not em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.raf-not em::before{content:"";width:10px;height:14px;border-radius:2px;background:var(--yesil)}
.raf-not em.yakin::before{background:var(--kirmizi)}
.raf-not em.orta::before{background:var(--amber)}
.miad-tablo{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.miad-tablo th{text-align:left;font-weight:500;color:var(--soluk);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--cizgi)}
.miad-tablo td{padding:9px 8px;border-bottom:1px solid var(--cizgi)}
.miad-tablo tr:last-child td{border-bottom:0}
.miad-tablo .s{text-align:right}

async function ozet(tuz, pin){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tuz + "|eczane-stok|" + pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function kayitliPin(){
  const { data, error } = await db.from("ayar").select("deger").eq("anahtar","tutar_pin").maybeSingle();
  if(error) throw error;
  return data ? data.deger : null;
}
async function pinDogru(pin, kayit){ const [tuz, h] = kayit.split(":"); return (await ozet(tuz, pin)) === h; }
async function pinKaydet(pin){
  const tuz = [...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const { error } = await db.from("ayar").upsert({ anahtar:"tutar_pin", deger: tuz+":"+await ozet(tuz,pin), guncelleme:new Date().toISOString() });
  if(error) throw error;
}

let yanlisSayisi = 0, beklet = 0;
$("#kilitFormu").addEventListener("submit", async e => {
  e.preventDefault();
  const h = $("#kilitHata"); h.textContent = "";
  if(Date.now() < beklet){ h.textContent = `Çok fazla yanlış deneme. ${Math.ceil((beklet-Date.now())/1000)} sn bekle.`; return; }
  const p1 = $("#pin1").value, p2 = $("#pin2").value, p3 = $("#pin3").value;
  const d = $("#kilitDugme"); d.disabled = true;
  try {
    if(kilitKip==="kur" || kilitKip==="degistir"){
      if(kilitKip==="degistir"){
        if(!(await pinDogru(p1, kilitKayit))){ h.textContent = "Şu anki şifre yanlış."; return; }
      } else if(await kayitliPin()){ return perdeAc("ac"); }   // bu arada başka biri oluşturduysa
      if(p2.length < 4){ h.textContent = "Şifre en az 4 karakter olmalı."; return; }
      if(p2 !== p3){ h.textContent = "İki şifre aynı değil."; return; }
      await pinKaydet(p2); perdeKapat(); kilidiAc();
    } else {
      if(!kilitKayit) return perdeAc("ac");
      if(await pinDogru(p1, kilitKayit)){ yanlisSayisi = 0; perdeKapat(); kilidiAc(); }
      else {
        yanlisSayisi++; $("#pin1").value = ""; $("#pin1").focus();
        if(yanlisSayisi >= 5){ beklet = Date.now() + 60000; yanlisSayisi = 0; h.textContent = "Çok fazla yanlış deneme. 1 dakika bekle."; }
        else h.textContent = "Şifre yanlış.";
      }
    }

  finally { d.disabled = false; }
});

// Oturum bekçisi: bilgisayar uykudan uyanınca / pencere öne gelince / 5 dk'da bir oturum tazelenir.
// Tazelenemiyorsa (oturum düşmüş) eski ekranda sessizce takılmak yerine giriş ekranına dönülür.
async function oturumKontrol(){
  if($("#program").classList.contains("gizli")) return true;
  try {
    const { data:{ session } } = await db.auth.getSession();
    if(session && session.expires_at*1000 > Date.now() + 60000) return true;
    const { data, error } = await db.auth.refreshSession();
    if(!error && data && data.session) return true;
    if(!error || /fetch|network|failed|timeout/i.test(error.message||"")) return true;   // internet yoksa dokunma
  } catch(e){ return true; }
  try { await db.auth.signOut({ scope:"local" }); } catch(e){}
  girisiAc(); $("#girisHata").textContent = "Oturum süresi dolmuş, lütfen tekrar giriş yap.";
  return false;
}

/* ---------- grafik yardımcıları ---------- */
const KISA = new Intl.NumberFormat("tr-TR",{notation:"compact",maximumFractionDigits:1});
const tlKisa = v => { v = Number(v||0); const a = Math.abs(v);
  if(a >= 1e6) return "₺" + (v/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1}) + " Mn";
  if(a >= 1e3) return "₺" + Math.round(v/1e3).toLocaleString("tr-TR") + " bin";
  return tl(v); };
const yuzde = (a,b) => b ? Math.round(a/b*100) : 0;
const RENK_DEPO = ["#2B78C8","#1E9E6E","#B48CF2","#E3A33B","#F07FA8","#6E8780"];

// Halka grafik: dilimler [{ad, deger, renk, link, ek}]
function halka(dilimler, merkezB, merkezK, bicim){
  const top = dilimler.reduce((t,d)=>t+Number(d.deger||0),0);
  const R = 58, C = 2*Math.PI*R; let bas = 0;
  const parca = top>0 ? dilimler.filter(d=>d.deger>0).map((d,i)=>{
    const u = d.deger/top*C, bosluk = dilimler.filter(x=>x.deger>0).length>1 ? 2 : 0;
    const s = `<circle class="dilim ${d.link?"tik":""}" data-i="${i}" ${d.link?`data-git="${d.link}"`:""} cx="75" cy="75" r="${R}" fill="none" stroke="${d.renk}" stroke-width="18"
      stroke-dasharray="${Math.max(u-bosluk,0.5)} ${C}" stroke-dashoffset="${-bas}" transform="rotate(-90 75 75)"><title>${kacis(d.ad)}: ${bicim(d.deger)} (%${yuzde(d.deger,top)})</title></circle>`;
    bas += u; return s; }).join("") : `<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--cizgi)" stroke-width="18"/>`;
  const gorunen = dilimler.filter(d=>d.deger>0);
  return `<div class="halka">
    <svg viewBox="0 0 150 150" role="img" aria-label="${kacis(merkezK)} dağılımı">${parca}
      <text class="merkez-b" x="75" y="76" text-anchor="middle">${kacis(merkezB)}</text>
      <text class="merkez-k" x="75" y="94" text-anchor="middle">${kacis(merkezK)}</text></svg>
    <div class="lj-liste">${gorunen.length?gorunen.map((d,i)=>{
      const ic = `<i style="background:${d.renk}"></i><span>${kacis(d.ad)}</span><b>${bicim(d.deger)}<small>%${yuzde(d.deger,top)}</small></b>`;
      return d.link ? `<button class="lj" type="button" data-i="${i}" data-git="${d.link}">${ic}</button>` : `<div class="lj" data-i="${i}">${ic}</div>`;
    }).join(""):`<div class="bilgi-not">Veri yok.</div>`}</div></div>`;
}
// İlk n kalemi göster, kalanını "Diğer" yap
function ilkN(liste, n){
  const l = (liste||[]).filter(x=>Number(x.tl)>0);
  if(l.length<=n) return l;
  const kalan = l.slice(n-1).reduce((t,x)=>t+Number(x.tl),0);
  return [...l.slice(0,n-1), {ad:"Diğer", tl:kalan}];
}
function adKisalt(a){ a = String(a||""); return a.replace(/\s+ECZA\s+DEPOSU.*$/i," Ecza").replace(/\s+DEPOSU$/i,"").replace(/ A\.Ş\.?$/i,""); }

// 12 aylık ciro / kâr çubukları + alış çizgisi
function aylikGrafik(aylik){
  const W=640, H=220, ust=12, alt=26, sol=4, sag=52;
  const n = aylik.length, en = Math.max(1, ...aylik.map(a=>Math.max(Number(a.ciro),Number(a.alis))));
  const adim = (W-sol-sag)/n, cg = adim*0.56, y = v => ust + (H-ust-alt)*(1-Number(v)/en);
  const cubuklar = aylik.map((a,i)=>{
    const x = sol + i*adim + (adim-cg)/2, d = new Date(a.ay);
    const ay = AYLAR[d.getMonth()] + (d.getMonth()===0?" "+String(d.getFullYear()).slice(2):"");
    return `<g class="cubuk-g"><title>${AYLAR[d.getMonth()]} ${d.getFullYear()} — ciro ${tl(a.ciro)}, kâr ${tl(a.kar)}, alış ${tl(a.alis)}</title>
      <rect class="c" x="${x}" y="${y(a.ciro)}" width="${cg}" height="${Math.max(H-alt-y(a.ciro),0)}" rx="4"/>
      <rect class="k" x="${x}" y="${y(a.kar)}" width="${cg}" height="${Math.max(H-alt-y(a.kar),0)}" rx="4"/>
      <text x="${x+cg/2}" y="${H-8}" text-anchor="middle">${ay}</text></g>`; }).join("");
  const nok = aylik.map((a,i)=>[sol + i*adim + adim/2, y(a.alis)]);
  const cizgi = `<path class="alis-cizgi" d="${nok.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}"/>`
    + nok.map(p=>`<circle class="alis-nokta" cx="${p[0]}" cy="${p[1]}" r="3"/>`).join("");
  const kilavuz = [0.25,0.5,0.75,1].map(f=>`<line x1="0" x2="${W-sag+6}" y1="${y(en*f)}" y2="${y(en*f)}" stroke="var(--cizgi)" stroke-dasharray="3 4"/>
    <text x="${W}" y="${y(en*f)+4}" text-anchor="end">${tlKisa(en*f)}</text>`).join("");
  return `<svg class="cizim" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 12 ay ciro, kâr ve alış">${kilavuz}${cubuklar}${cizgi}</svg>`;
}
// Son 30 gün ciro alanı
function gunlukGrafik(g){
  const W=320, H=120, en = Math.max(1, ...g.map(x=>Number(x.ciro)));
  const p = g.map((x,i)=>[i*(W/(g.length-1)), 8+(H-16)*(1-Number(x.ciro)/en)]);
  const yol = p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const son = p[p.length-1];
  return `<svg class="cizim gunluk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Son 30 gün günlük ciro">
    <defs><linearGradient id="gd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0F8A5F" stop-opacity=".45"/><stop offset="1" stop-color="#0F8A5F" stop-opacity="0"/></linearGradient></defs>
    <path d="${yol} L${W} ${H} L0 ${H} Z" fill="url(#gd)"/><path d="${yol}" fill="none" stroke="#0F8A5F" stroke-width="2"/>
    <circle cx="${son[0]}" cy="${son[1]}" r="3.5" fill="#0F8A5F"/>
    ${g.map((x,i)=>`<rect x="${p[i][0]-W/g.length/2}" y="0" width="${W/g.length}" height="${H}" fill="transparent"><title>${tarih(x.gun)}: ${tl(x.ciro)} ciro, ${tl(x.kar)} kâr</title></rect>`).join("")}
  </svg>`;
}

const OLU_FILTRE = () => `son_satis.lt.${gunSonra(-180)},and(son_satis.is.null,or(son_alis.is.null,son_alis.lt.${gunSonra(-180)}))`;
// Hiç satmayan: hiç satış yok ve en az 1 aydır elde (alış kaydı yoksa eski stok)
const HIC_FILTRE = () => `son_alis.is.null,son_alis.lt.${gunSonra(-30)}`;
// Ana ekran kartları için kalem ve maliyet toplamı (sayfa sayfa okur)
async function stokToplam(sorgu){
  let kalem = 0, tl = 0;
  for(let i=0;i<20000;i+=1000){ const { data, error } = await sorgu().range(i, i+999); if(error) return null;
    for(const r of data){ kalem++; tl += Number(r.stok_maliyet)||0; } if(data.length < 1000) break; }
  return { kalem, tl };
}

// Aylık hız: son 3 ay ortalaması; yeterli satış varsa son 12 ayın aylık dağılımıyla mevsime göre düzeltilir.
async function kalacakHesapla(){
  const { data: partiler, error } = await db.from("miad_listesi").select("barkod,ad,miad,parti_no,kutu,psf").gte("miad", gunSonra(0)).lt("miad", gunSonra(365)).order("miad").limit(5000);
  if(error) return { data:null, error };
  const barkodlar = [...new Set(partiler.map(p=>p.barkod))]; const oz = {};
  for(let i=0;i<barkodlar.length;i+=300){ const { data, error:e } = await db.from("urun_ozet").select("barkod,ad,stok,adet_90,adet_365,birim_maliyet,psf").in("barkod", barkodlar.slice(i,i+300)); if(e) return { data:null, error:e }; for(const u of data||[]) oz[u.barkod]=u; }
  const tumu = {}; for(const p of partiler){ (tumu[p.barkod] = tumu[p.barkod] || []).push(p); }
  const gunlukDuz = u => (u.adet_90||0)/90;
  // ay ay beklenen satış (bugünden 'son'a kadar)
  const beklenen = (u, son, aylar) => {
    const bas = new Date(); bas.setHours(0,0,0,0); const bit = new Date(son); let top = 0;
    const duz = gunlukDuz(u);
    if(!aylar) return Math.max(0, (bit-bas)/864e5) * duz;
    const ort = aylar.reduce((a,x)=>a+x,0)/12 || 0;
    const idx = m => ort ? Math.min(3, Math.max(0.3, aylar[m]/ort)) : 1;
    const bugunAy = bas.getMonth(); const son3 = [1,2,3].map(k=>idx((bugunAy-k+12)%12)); const seviye = son3.reduce((a,x)=>a+x,0)/3 || 1;
    for(let d=new Date(bas); d<bit; d.setDate(d.getDate()+1)) top += duz / seviye * idx(d.getMonth());
    return top;
  };
  const hesapla = (barkod, aylar) => {
    const u = oz[barkod]; if(!u) return [];
    let tuketilen = 0; const sonuc = [];
    for(const p of tumu[barkod]){
      const s = beklenen(u, p.miad, aylar); const satilabilir = Math.max(0, s - tuketilen);
      const satilir = Math.min(p.kutu, satilabilir); const kalacak = Math.round(p.kutu - satilir);
      tuketilen += satilir;
      if(kalacak > 0) sonuc.push({ ...p, ad:u.ad||p.ad, kalacak, satilir:Math.round(satilabilir), aylik:(u.adet_90||0)/3, maliyet:u.birim_maliyet, mevsim:!!aylar });
    }
    return sonuc;
  };
  // 1) düz hızla adaylar, 2) en büyük 80 aday için mevsimli yeniden hesap (son 12 ay ay ay satış)
  const duzTop = {}; for(const b of barkodlar){ const l = hesapla(b,null); if(l.length) duzTop[b] = l.reduce((s,r)=>s+r.kalacak*(r.maliyet||r.psf||0),0); }
  const adaylar = Object.keys(duzTop).sort((a,b)=>duzTop[b]-duzTop[a]);
  const mevsimli = {};
  const ilk = adaylar.slice(0,80);
  for(let i=0;i<ilk.length;i+=6){ await Promise.all(ilk.slice(i,i+6).map(async b=>{ const u=oz[b]; if(!u || (u.adet_365||0) < 24) return;
      const { data } = await db.rpc("urun_aylik", { p_barkod:b }); if(!data || data.length<12) return;
      const aylar = Array(12).fill(0); for(const a of data){ aylar[new Date(a.ay).getMonth()] += Number(a.adet)||0; } mevsimli[b] = aylar; })); }
  const satirlar = adaylar.flatMap(b=>hesapla(b, mevsimli[b]||null));
  satirlar.sort((a,b)=>(b.kalacak*(b.maliyet||b.psf||0))-(a.kalacak*(a.maliyet||a.psf||0)));
  return { data: satirlar.slice(0,300), error:null };
}
function gunSonra(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function urunHucre(r){ return `${kacis(r.ad||r.barkod)}<span class="kucuk">${kacis(r.barkod)}</span>`; }

async function liste(k){
  if(k==="depo"){ location.hash = "depolar"; return; }
  const L = LISTELER[k]; if(!L) return anaEkran();
  if(L.kilitli && kilitli()){
    $("#icerik").innerHTML = `<button class="geri" type="button" onclick="location.hash=''">‹ Ana ekran</button>
      <div class="liste-ust"><div><h1>${L.ad}</h1><p>${L.ac}</p></div></div>

  yukleniyor();
  const { data, error } = await L.sorgu();

  $("#icerik").innerHTML = `

      <div><h1>${L.ad}</h1><p>${L.ac}</p></div>
      ${data.length?`<button class="ikincil" type="button" id="indir">Excel'e indir</button>`:""}

        + data.map(r=>{ const h=L.satir(r); return `<button class="satir" type="button" data-barkod="${kacis(r.barkod)}"><span class="ad">${h[0]}</span>${h.slice(1).map((x,i)=>`<span class="s ${i<h.length-2?"ek":""}">${x}</span>`).join("")}</button>`; }).join("")
        : `<div class="bos">Bu listede şu an ürün yok.</div>`}

  document.querySelectorAll("[data-barkod]").forEach(b=>b.addEventListener("click",()=>location.hash="urun/"+b.dataset.barkod));
  const ind = $("#indir"); if(ind) ind.addEventListener("click",()=>csvIndir(L.ad, L.csvBas, data.map(L.csv)));

function csvIndir(ad, bas, satirlar){
  const h = v => { const s = v==null?"":String(v).replace(".", ","); return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const metin = "﻿" + [bas, ...satirlar].map(r=>r.map(h).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([metin],{type:"text/csv;charset=utf-8"}));
  a.download = `${ad} ${new Date().toISOString().slice(0,10)}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ---------- arama ---------- */
let araZaman, aramaNo = 0;
$("#ara").addEventListener("input", e => {
  clearTimeout(araZaman);
  const q = e.target.value;
  araZaman = setTimeout(()=>{ if(araMetni(q).length>=2) location.hash = "ara/"+encodeURIComponent(q); else if(!q) location.hash=""; }, 300);

async function aramaSonucu(q){
  if($("#ara").value !== q) $("#ara").value = q;
  const t = araMetni(q);
  const sorgu = /^\d{5,}$/.test(t)
    ? db.from("urun_ozet").select("*").like("barkod", `%${t}%`)
    : db.from("urun_ozet").select("*").ilike("ara", `%${t.split(/\s+/).join("%")}%`);
  const benim = ++aramaNo;
  const { data, error } = await sorgu.order("stok",{ascending:false}).limit(60);
  if(benim !== aramaNo) return; // daha yeni bir arama başladı
  if(error) return hataGoster(error);
  $("#icerik").innerHTML = `
    <div class="liste-ust"><div><h1>“${kacis(q)}”</h1><p>${data.length} ürün bulundu${data.length===60?" (ilk 60)":""}.</p></div></div>
    <button class="da-dugme" type="button" id="daAra">🏷️ Depolarda ara: “${kacis(q)}” <small>elinde olmayanlar dahil, bütün depolarda</small></button>
    <div class="tablo">
      ${data.length ? `<div class="satir bas"><span>Ürün</span><span class="s ek">Stok</span><span class="s ek">Aylık satış</span><span class="s">PSF</span></div>`
        + data.map(r=>`<button class="satir" type="button" data-barkod="${kacis(r.barkod)}"><span class="ad">${urunHucre(r)}</span><span class="s ek">${sayi(r.stok)}</span><span class="s ek">${sayi(r.adet_90/3)}</span><span class="s">${tl(r.psf)}</span></button>`).join("")
        : `<div class="bos">Bu adla ürün bulunamadı. Adın bir kısmını ya da barkodu yazmayı dene.</div>`}
    </div>`;
  document.querySelectorAll("[data-barkod]").forEach(b=>b.addEventListener("click",()=>location.hash="urun/"+b.dataset.barkod));
  $("#daAra").onclick = ()=>location.hash = "depoara/"+encodeURIComponent(q);
  if(!/^\d{5,}$/.test(t)){ const ek = await kategoriSonucu(q, t).catch(()=>""); if(ek && benim===aramaNo){ $("#icerik").insertAdjacentHTML("beforeend", ek);
    document.querySelectorAll("[data-barkod]").forEach(b=>b.onclick=()=>location.hash="urun/"+b.dataset.barkod); } }
}

async function urunKarti(barkod){
  yukleniyor();
  const [oz, kk, ay, gb] = await Promise.all([
    db.from("urun_ozet").select("*").eq("barkod", barkod).maybeSingle(),
    db.from("karekod").select("miad,parti_no,ilk_gorulme").eq("barkod", barkod).eq("aktif", true).order("miad"),
    db.rpc("urun_aylik", { p_barkod: barkod }),
    db.from("gebelik_ozet").select("gebelik").eq("barkod", barkod).maybeSingle(),
  ]);
  const hata = oz.error || kk.error || ay.error; if(hata) return hataGoster(hata);
  const geb = (gb && !gb.error && gb.data && gb.data.gebelik) ? gb.data.gebelik : "";
  const r = oz.data;
  if(!r){ $("#icerik").innerHTML = `<button class="geri" type="button" onclick="geriBolum()">‹ Geri</button><button class="da-dugme" type="button" onclick="location.hash='depoara/${kacis(barkod)}'">🏷️ Depolarda ara <small>bu barkod stok listende yok</small></button><div class="tablo"><div class="bos">Bu barkodla ürün bulunamadı.</div></div>`; return; }

  const aylik = (r.adet_90||0)/3;
  const kutuKar = r.adet_365 ? r.kar_365 / r.adet_365 : null;
  const kutular = kk.data || [];
  // miat + parti grupları
  const gruplar = [];
  for(const k of kutular){
    const g = gruplar.find(x=>x.miad===k.miad && x.parti===k.parti_no);
    if(g){ g.kutu++; if(k.ilk_gorulme<g.ilk) g.ilk=k.ilk_gorulme; } else gruplar.push({miad:k.miad, parti:k.parti_no, kutu:1, ilk:k.ilk_gorulme});
  }
  const rafKare = kutular.slice(0,240).map(k=>`<i class="${miadSinifi(k.miad)}" title="${tarih(k.miad)}"></i>`).join("");
  const enYuksek = Math.max(1, ...(ay.data||[]).map(a=>Number(a.adet)));

  $("#icerik").innerHTML = `
    <button class="geri" type="button" onclick="geriBolum()">‹ Geri</button>
    ${okutmaBandi(barkod)}<div class="urun-bas"><h1>${kacis(r.ad||barkod)}</h1><p>${kacis(barkod)}${r.uretici?" · "+kacis(r.uretici):""}</p>${gebelikKisa(geb)?`<div style="margin-top:4px">${gebelikKisa(geb)}</div>`:""}</div>
    <div class="bilgiler">
      <div class="bilgi"><span>Stok</span><b>${sayi(r.stok)} kutu</b><small>${kilitli()?"&nbsp;":tl(r.stok_maliyet)+" maliyet"}</small></div>
      <div class="bilgi"><span>Ayda ortalama satış</span><b>${sayi(aylik)}</b><small>son 3 aya göre</small></div>
      <div class="bilgi"><span>Elindeki stok yeter</span><b>${r.kac_ay_yeter!=null?sayi(r.kac_ay_yeter)+" ay":(r.stok>0?"Satış yok":"—")}</b><small>${r.son_satis?"son satış "+tarih(r.son_satis):"hiç satılmamış"}</small></div>
      <div class="bilgi"><span>PSF</span><b>${tl(r.psf)}</b><small>${r.kamu?"kamu "+tl(r.kamu):"&nbsp;"}</small></div>
      <div class="bilgi"><span>Kutu maliyeti</span><b>${r.birim_maliyet!=null?para(r.birim_maliyet):"—"}</b><small>${r.son_birim_maliyet!=null&&!kilitli()?"son alışta MF dahil "+tl(r.son_birim_maliyet):"&nbsp;"}</small></div>
      <div class="bilgi"><span>Kutu başı kâr</span><b>${kutuKar!=null?para(kutuKar):"—"}</b><small>son 12 ay ortalaması</small></div>
      <div class="bilgi"><span>12 ayda kâr</span><b>${para(r.kar_365)}</b><small>${sayi(r.adet_365)} kutu${kilitli()?" satıldı":", "+tl(r.ciro_365)+" ciro"}</small></div>
      <div class="bilgi"><span>Son alış</span><b>${r.son_alis?tarih(r.son_alis):"—"}</b><small>${kilitli()?"&nbsp;":(kacis(r.son_depo||"")||"&nbsp;")}</small></div>
    </div>

    <div class="kutu-blok">
      <h2 class="baslik" style="margin:0">Raftaki kutular</h2>
      ${kutular.length ? `
        <div class="raf" aria-label="${kutular.length} karekodlu kutu, miada göre sıralı">${rafKare}</div>
        ${kutular.length>240?`<div class="alt-not">İlk 240 kutu gösteriliyor.</div>`:""}
        <div class="raf-not"><em class="yakin">3 aydan az</em><em class="orta">3–6 ay</em><em>6 aydan fazla</em></div>
        <table class="miad-tablo">
          <thead><tr><th>Miat</th><th>Parti</th><th class="s">Kutu</th><th class="s">Rafta</th></tr></thead>
          <tbody>${gruplar.map((g,i)=>`<tr>
            <td><span class="etiket ${miadSinifi(g.miad)||(i===0?"ilk":"uzak")}">${tarih(g.miad)}</span>${i===0&&gruplar.length>1?` <small style="color:var(--soluk)">önce bunu ver</small>`:""}</td>
            <td>${kacis(g.parti||"—")}</td><td class="s">${g.kutu}</td>
            <td class="s">${gunFarki(g.ilk)!==null?`${-gunFarki(g.ilk)} gün`:"—"}</td></tr>`).join("")}</tbody>
        </table>`
      : `<div class="bos" style="padding:20px 0 4px">Bu ürün için karekodlu kutu kaydı yok${r.stok>0?" (barkodlu ürünlerde karekod olmaz)":""}.</div>`}
    </div>

    <div class="kutu-blok">
      <h2 class="baslik" style="margin:0">Son 12 ayda satış</h2>
      <div class="grafik">${(ay.data||[]).map(a=>{ const d=new Date(a.ay); return `<div><em>${Number(a.adet)?sayi(a.adet):""}</em><span class="cubuk" style="height:${Math.round(Number(a.adet)/enYuksek*100)}%"></span><small>${AYLAR[d.getMonth()]}</small></div>`; }).join("")}</div>
    </div>`;
  const dp = await depoUrunSatiri(barkod);
  if(location.hash.includes(barkod)) $(".bilgiler").insertAdjacentHTML("afterend", `<button class="da-dugme" type="button" id="daUrun">🏷️ Depolarda şimdi ara <small>${dp?"güncel fiyat, stok ve MF":"bu ürün saatlik depo listesinde yok — depolarda ara"}</small></button>`);
  const dau = $("#daUrun"); if(dau) dau.onclick = ()=>location.hash = "depoara/"+barkod;
  if(dp && location.hash.includes(barkod)) { $("#daUrun").insertAdjacentHTML("afterend", dp);
    document.querySelectorAll("[data-sepet]").forEach(b=>b.addEventListener("click", ()=>{ const [k,a,m]=b.dataset.sepet.split("|"); sepetAc(k, barkod, r.ad||barkod, +a, +m); })); }
}

/* =====================================================================
   DEPOLAR — AS / Sancak fiyat ve MF karşılaştırması (toplayıcı saatte bir yazar)
   ayar.depo_fiyat = {zaman, depolar[], u:[{b,ad,st,a90,as:{d,s,v,mf:[{a,m,n,v}]},sn:{...},y}]}
   ===================================================================== */
const DEPO_AD = { as:"AS", sn:"Sancak", bek:"BEK" };
let DEPO = null, DEPO_ZAMAN = 0, DEPO_FILTRE = "alinacak";
async function depoYukle(zorla){
  if(DEPO && !zorla && Date.now()-DEPO_ZAMAN < 120000) return DEPO;
  const { data, error } = await db.from("ayar").select("deger").eq("anahtar","depo_fiyat").maybeSingle();
  if(error) throw error;
  DEPO = data ? JSON.parse(data.deger) : null; DEPO_ZAMAN = Date.now(); return DEPO;
}
const depoYeni = u => u.y && (Date.now() - new Date(u.y)) < 48*3600e3;
function depoEnIyi(u){
  let en = null;
  for(const k of ["as","sn","bek"]){ const d = u[k]; if(!d) continue;
    const secenek = (d.mf||[]).filter(o=>o.n>0).length ? d.mf.filter(o=>o.n>0) : (d.d ? [{a:1,m:0,n:d.d,v:d.v}] : []);
    for(const o of secenek){ if(!en || o.n < en.n) en = {...o, k}; } }
  return en;
}
// MF önceliği: çok satan + stoğu az kalan + MF'si gerçekten işine yarayan (MF adedi en fazla ~3 aylık satış)
function depoOncelik(u){
  const aylik = (u.a90||0)/3; if(aylik < 1) return null;
  let en = null;
  for(const k of ["as","sn","bek"]){ const d = u[k]; if(!d) continue;
    for(const o of (d.mf||[])){ if(!(o.m>0)) continue; if(o.a + o.m > aylik*3.5) continue;
      const kazanc = o.m/(o.a+o.m); if(!en || kazanc > en.kazanc) en = {...o, k, kazanc}; } }
  if(!en) return null;
  const gun = aylik ? Math.round((u.st||0)/aylik*30) : 999;
  const aciliyet = gun < 7 ? 3 : gun < 15 ? 2 : gun < 30 ? 1.4 : gun < 60 ? 1 : 0.3;
  return { ...en, gun, aylik, puan: aylik * aciliyet * (1 + en.kazanc*2) * (depoYeni(u)?1.5:1) };
}
// fiyatlar depolardan KDV hariç gelir; ekranda KDV dahil "tanesi kaça geliyor" gösterilir
const depoKdv = u => (u && u.sn && u.sn.k != null) ? Number(u.sn.k) : 10;
const kdvli = (n, u) => n * (1 + depoKdv(u)/100);
// her MF seçeneği (a+m) için en ucuz birim fiyat
function depoSecenekler(d){
  const m = new Map();
  for(const o of (d && d.mf) || []){ if(!(o.n>0)) continue; const k = o.a+"+"+(o.m||0); const v = m.get(k); if(!v || o.n < v.n) m.set(k, o); }
  if(!m.size && d && d.d) m.set("1+0", {a:1,m:0,n:d.d,v:d.v});
  return [...m.values()].sort((x,y)=>(x.a+x.m)-(y.a+y.m));
}
const secenekAd = o => o.m ? `${o.a}+${o.m}` : (o.a>1 ? `${o.a} adet` : "1 adet");
/* ---------- MF hesabı: depolara 3 ay vadeyle ödeniyor ----------
   MF ile alınan mal, eldeki stokla birlikte vade gelmeden satılıyorsa parası satıştan ödenir → MF'nin indirimi doğrudan kâr.
   3 ayda eriyor: AL · 3–5 ay: DİKKAT (vade gününde rafta mal kalır) · 5 aydan uzun: ALMA */
const VADE_AY = 3;
function mfTaban(d){   // MF'siz tek kutunun fiyatı (KDV hariç)
  const tek = ((d && d.mf) || []).filter(o=>o.n>0 && !(o.m>0)).map(o=>o.n);
  if(tek.length) return Math.min(...tek);
  return d && d.d > 0 ? d.d : null;
}
function mfHesap(u, k, o){
  const aylik = (u.a90||0)/3, st = Math.max(0, Number(u.st)||0), kutu = o.a + (o.m||0);
  // karşılaştırma: MF'siz alsaydın depolardaki en ucuz tek kutu fiyatı
  const tabanlar = ["as","sn","bek"].map(x=>u[x] && u[x].s!==0 ? mfTaban(u[x]) : null).filter(x=>x>0);
  const taban = tabanlar.length ? Math.min(...tabanlar) : mfTaban(u[k]);
  const erime = aylik > 0 ? (st + kutu) / aylik : Infinity;
  const kalan = Math.min(kutu, Math.max(0, st + kutu - aylik*VADE_AY));
  const kazanc = taban ? Math.max(0, taban - o.n) * kutu : 0;
  const indirim = taban ? Math.max(0, 1 - o.n/taban) : (o.m ? o.m/kutu : 0);
  const karar = aylik < 1/3 ? "satmiyor" : erime <= VADE_AY ? "al" : erime <= 5 ? "dikkat" : "alma";
  return { k, ...o, kutu, aylik, erime, kalan, rafta: kalan*o.n, kazanc, indirim, karar };
}
// her depodaki her MF basamağını hesaplar; en mantıklısı başta (önce "al", sonra en çok kazandıran)
function mfOneri(u){
  const l = [];
  for(const k of ["as","sn","bek"]){ const d = u[k]; if(!d || d.s===0) continue;
    for(const o of depoSecenekler(d)) if(o.m>0) l.push(mfHesap(u, k, o)); }
  if(!l.length) return null;
  const sira = { al:0, dikkat:1, alma:2, satmiyor:3 };
  l.sort((x,y)=>(sira[x.karar]-sira[y.karar]) || (y.kazanc-x.kazanc) || (x.erime-y.erime));
  return { en: l[0], hepsi: l };
}
const MF_KARAR = { al:["✅","Al","var(--yesil)"], dikkat:["⚠️","Dikkat","var(--amber)"], alma:["⚠️","Dikkat","var(--amber)"], satmiyor:["⚠️","Dikkat","var(--amber)"] };

  { k:"bogaz",  ad:"Boğaz spreyi",            ara:["bogaz spreyi","bogaz spray","agiz spreyi"],   bul:/(sprey|spray).*(bogaz|agiz)|(bogaz|agiz).*(sprey|spray)/ },
  { k:"burun",  ad:"Burun spreyi · damlası",  ara:["burun spreyi","burun damlasi","burun"],       bul:/burun|nazal|nasal/ },

// Kontrol sırası: önce belirgin olanlar (gargara, burun, göz…), en son genel tablet/krem kalıpları
const NV_KONTROL = ["gargara","burun","goz","kulak","bogaz","serum","fitil","oralKesin","igne","krem","oral"];
const NV_ORAL_KESIN = /\boral\b|surup|tablet|kapsul|draje|efervesan|\bsase|eliksir|pastil|cigneme|\bftb\b|\bkase\b/;
function nvSekil(ad, en){
  const t = " " + araMetni(ad) + " ", e = " " + araMetni(en) + " ";
  for(const k of NV_KONTROL){ const s = NV_SEKIL.find(x=>x.k===k);
    if(k==="oralKesin"){ if(NV_ORAL_KESIN.test(t)) return "oral"; continue; }
    if(k==="serum"){ if(/ serum/.test(e) && !/serum icin/.test(e)) return "serum"; continue; }
    if(k==="bogaz" || k==="burun" || k==="goz" || k==="kulak"){ if(s.bul.test(t) || (s.bul.test(e) && /sprey|spray|damla|merhem|pomad/.test(t))) return k; }
    else if(s.bul.test(t)) return k; }
  if(/\d ?ml\b/.test(t) && !/igne|siringa|perfuzyon|intraven/.test(t)) return "oral";   // ör. 150 ML şurup
  return "diger";
}

/* ---------- gebelik kategorisi (Rx: A/B/C/D/X + C1C2D3 trimester kodu) ---------- */
const GEBELIK = {
  A:["güvenli","insanda çalışma var, en güvenli"],
  B:["zararı kanıtlanmamış","hayvanda risk yok ya da insanda gösterilmemiş"],
  C:["yarar/zarar oranına göre","hayvanda risk var, gerekirse kullanılır"],
  D:["kanıtlı risk, yarara göre","insanda risk var ama bazı durumlarda gerekebilir"],
  X:["gebelikte kesin yasak","risk her zaman yarardan fazla"]

function gebelikCoz(g){
  if(!g) return null; g=String(g).trim().toUpperCase().replace(/\s+/g,""); if(!g) return null;
  const m=[...g.matchAll(/([ABCDX])([123])/g)];
  if(m.length){ const tri=m.map(x=>({t:+x[2],h:x[1]})); const hs=new Set(tri.map(x=>x.h));
    if(hs.size===1) return {tek:[...hs][0]}; return {tri}; }
  const s=g.match(/[ABCDX]/); return s?{tek:s[0]}:null;
}
function gebelikTam(g){ const c=gebelikCoz(g); if(!c) return "";
  if(c.tek){ const [k,f]=GEBELIK[c.tek]; return `<span class="gebelik">🤰 <b>${c.tek}</b> · ${k} <span class="gb-ac">(${f})</span></span>`; }
  return `<span class="gebelik">🤰 Trimester'e göre:`+c.tri.map(x=>{const[k]=GEBELIK[x.h];return `<br>${x.t}. trimester → <b>${x.h}</b> · ${k}`;}).join("")+`</span>`;
}
function gebelikKisa(g){ const c=gebelikCoz(g); if(!c) return "";
  if(c.tek){ const [k]=GEBELIK[c.tek]; return `<span class="gebelik-k">🤰 <b>${c.tek}</b> · ${k}</span>`; }
  const sira={A:1,B:2,C:3,D:4,X:5}; const en=c.tri.reduce((a,b)=>sira[b.h]>sira[a.h]?b:a);
  const [k]=GEBELIK[en.h]; return `<span class="gebelik-k">🤰 <b>${en.h}</b>* · ${k}</span>`;
}
async function gebelikHarita(barkodlar){

async function ibStokKur(){

    const { data, error } = await db.from("urun_ozet").select("barkod,ad").gt("stok",0).range(s, s+999);

function ibStokta(d){

/* =====================================================================
   HASTA TAKİBİ — İlacı biten / raporu biten hastalar
   Hasta adı ve telefon şifreli saklanır: anahtar "hasta şifresi"nden
   türetilir (PBKDF2-SHA256), veri AES-CBC + HMAC-SHA256 ile şifrelidir.
   Sunucuda sadece okunamaz metin durur.
   ===================================================================== */
const H = { anahtar:null, veri:null, durum:{}, sablon:null, gorunum:"raporlu", mesaj:"hepsi" };
const HKONTROL = "ECZANE-STOK-HASTA";
const HSABLON_VARSAYILAN = {
  ilac: "Merhaba {ad}, {eczane}'nden yazıyoruz. {ilac} için reçete zamanınız geldi, {tarih} tarihinden itibaren yazdırabilirsiniz. Doktorunuza reçetenizi yazdırıp eczanemize uğrayabilirsiniz. İyi günler dileriz 😊",
  rapor: "Merhaba {ad}, {eczane}'nden yazıyoruz. {ilac} için kullandığınız raporun bitiş tarihi {tarih}. İlacınızı aksatmamak için raporunuzu doktorunuza yeniletmenizi rica ederiz. İyi günler dileriz 😊"
};
const b64 = u8 => { let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function hAnahtarTuret(sifre, tuzB64){
  const ham = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:unb64(tuzB64), iterations:200000, hash:"SHA-256"}, ham, 512));
}
async function hAnahtarlar(k){
  return { aes: await crypto.subtle.importKey("raw", k.slice(0,32), {name:"AES-CBC"}, false, ["encrypt","decrypt"]),
           mac: await crypto.subtle.importKey("raw", k.slice(32,64), {name:"HMAC", hash:"SHA-256"}, false, ["sign","verify"]) };
}
async function gz(u8, yon){
  const akis = new Blob([u8]).stream().pipeThrough(yon ? new CompressionStream("gzip") : new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(akis).arrayBuffer());
}
async function hSifrele(k, metin){
  const { aes, mac } = await hAnahtarlar(k);
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC", iv}, aes, await gz(new TextEncoder().encode(metin), true)));
  const ivct = new Uint8Array(16+ct.length); ivct.set(iv); ivct.set(ct,16);
  const m = new Uint8Array(await crypto.subtle.sign("HMAC", mac, ivct));
  const t = new Uint8Array(ivct.length+32); t.set(ivct); t.set(m, ivct.length); return b64(t);
}
async function hCoz(k, s){
  const { aes, mac } = await hAnahtarlar(k); const t = unb64(s);
  const ivct = t.slice(0, t.length-32), m = t.slice(t.length-32);
  if(!await crypto.subtle.verify("HMAC", mac, m, ivct)) throw new Error("SIFRE");
  const duz = new Uint8Array(await crypto.subtle.decrypt({name:"AES-CBC", iv:ivct.slice(0,16)}, aes, ivct.slice(16)));
  return new TextDecoder().decode(await gz(duz, false));
}
async function ayarOku(anahtar){ const { data, error } = await db.from("ayar").select("deger,guncelleme").eq("anahtar",anahtar).maybeSingle(); if(error) throw error; return data; }

function hUnut(){ H.anahtar = null; H.veri = null; H.durum = {}; try{ localStorage.removeItem(ANAHTAR("hastaKey")); sessionStorage.removeItem(ANAHTAR("hastaKey")); }catch(e){} $("#hastaRozet").classList.add("gizli"); }
// Otomatik anahtar: hasta anahtarı Supabase'de (RLS ile sadece giriş yapan okur) saklanır,
// böylece Hastalar/Sipariş hasta şifresi SORMADAN açılır. Veri yine şifreli + login arkasında.
async function hOtoYukle(){
  if(H.anahtar) return H.anahtar;
  try{ const o = await ayarOku("hasta_anahtar_oto"); if(o && o.deger){ const k = unb64(o.deger); H.anahtar = k; try{ localStorage.setItem(ANAHTAR("hastaKey"), o.deger); }catch(e){} return k; } }catch(e){}
  return null;
}

async function hAnahtarHazirla(kontDeger){
  let k = hAnahtarYukle() || await hOtoYukle();
  if(k){ try{ await hCoz(k, kontDeger); }catch(e){ k=null; hUnut(); } }
  if(k) hOtoYaz();   // diğer cihazlar bir daha sormasın diye buluta yaz (bootstrap)
  return k;
}

function gunStr(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function gunGoreli(d){ const g = gunFarki(d); if(g===null) return "—"; if(g===0) return "bugün"; if(g===1) return "yarın"; if(g===-1) return "dün"; return g>0 ? g+" gün sonra" : (-g)+" gün geçti"; }
function telNo(t){ let s = String(t||"").replace(/\D/g,""); if(!s) return ""; if(s.startsWith("0090")) s=s.slice(2); if(s.startsWith("0")) s=s.slice(1); if(s.length===10 && s[0]==="5") s="90"+s; return /^905\d{9}$/.test(s) ? s : ""; }

    H.sablon = Object.assign({}, HSABLON_VARSAYILAN, s ? JSON.parse(s.deger) : {});
  } catch(e){ return hataGoster(e); }
  hCiz();
}

function hGruplar(){
  const V = H.veri || {ilac:[], rapor:[]};
  const raporsuz = H.gorunum==="raporsuz";

function hStokUyari(satirlar){

function hIlacKisa(ad){
  const t = String(ad||"").trim(); if(!t) return "";
  const parca = t.split(/\s+/); let marka = [];
  for(const w of parca){ const u = w.toLocaleUpperCase("tr-TR").replace(/[^\p{L}]/gu,""); if(HFORM.has(u) || /^\d/.test(w)) break; marka.push(w.replace(/[,;]+$/,"")); }
  if(!marka.length) marka = [parca[0]];
  const doz = (t.match(/\d+(?:[.,]\d+)?(?:\/\d+(?:[.,]\d+)?)?\s*(?:mg|mcg|µg|g|ml|iu|ıu|ü)(?![\p{L}])/iu)||[""])[0].replace(/\s+/," ").toLowerCase();
  const m = marka.join(" ").toLocaleLowerCase("tr-TR").replace(/(^|[\s/-])\S/g, c=>c.toLocaleUpperCase("tr-TR"));
  return (m + (doz?" "+doz:"")).trim();
}

/* Köprü (siparis-tara.ps1) sgk_son'a tek aday yazar; web burada kendi kalıcı
   listesine (sgk_aday) ekler. sonZaman = en son işlenen tarama; aynı tarama
   tekrar eklenmez (reddedilen geri gelmez), yeni tarama (yeni zaman) eklenir. */
async function sSonBirlestir(son){
  if(!son || !son.zaman || !son.rec) return false;
  if(S.aday.sonZaman === son.zaman) return false;           // bu tarama zaten işlendi
  S.aday.sonZaman = son.zaman;
  const ordered = S.kayit.some(o=>o.kaynak==="sgk" && o.rec===son.rec && o.durum!=="teslim");
  const idx = S.aday.liste.findIndex(r=>r.rec===son.rec);
  const kayit = { rec:son.rec, prot:son.prot||"", tarih:son.tarih||"", ad:son.ad||"", tc:son.tc||"", tel:son.tel||"", ilac:son.ilac||[], eklendi:son.zaman };
  if(idx>=0) S.aday.liste[idx] = kayit;                     // aynı reçete tekrar tarandı → güncelle
  else if(!ordered) S.aday.liste.unshift(kayit);            // yeni aday
  await sAdayKaydet();
  return true;
}

async function sDepoEkle(id){

    ${ilaclar.length ? ilaclar.map((x,i)=>`<div class="hkart"><div class="ad">${kacis(x.ad)} <span class="hkucuk">· ${x.adet} sipariş</span></div><div data-dacik="${i}" class="hkucuk" style="margin:4px 0;color:var(--soluk)"></div><div data-dfiyat="${i}"><p class="hkucuk" style="margin:4px 0;color:var(--soluk)">⏳ yükleniyor…</p></div></div>`).join("") : '<div class="hkart"><p class="hkucuk" style="margin:0">İlaç yok.</p></div>'}`;

    if(z.adet_90!=null){ p.push(`3 ayda ~${sayi(z.adet_90)} satıyor`); p.push(`ayda ~${sayi(Math.round((z.adet_90||0)/3*10)/10)}`); }

  const fiyatHtml = (x,u)=>{
    const dBtn=(k,a,m,n,et)=>`<button class="hcip" type="button" style="margin:2px 4px 2px 0${m>0?'':';border-style:dashed'}" data-dep="${k}" data-bar="${kacis(x.bar)}" data-ad="${kacis(x.ad)}" data-a="${a}" data-m="${m}">${et} → ${tl(kdvli(n,u))}</button>`;
    const dep=["as","sn","bek"].map(k=>{ const d=u[k]; if(!d) return ""; const tek=mfTaban(d); const mfSecs=depoSecenekler(d).filter(s=>s.m>0).slice(0,4); if(!(tek>0)&&!mfSecs.length) return ""; const btns=(tek>0?dBtn(k,1,0,tek,"MF'siz 1 adet"):"")+mfSecs.map(s=>dBtn(k,s.a,s.m||0,s.n,secenekAd(s))).join(""); return `<div style="margin-top:6px"><b>${DEPO_AD[k]}</b>${d.s===0?' <span class="hetk kirmizi">stok yok</span>':''} <span>${btns}</span></div>`; }).join("");
    const oneri=mfOneri(u); const oneriTxt=oneri?(()=>{ const h=oneri.en, mk=MF_KARAR[h.karar]||["",""]; return `${mk[0]} <b>${mk[1]}</b> — ${DEPO_AD[h.k]} <b>${h.a}+${h.m}</b>: stokla birlikte ${ayMetin(h.erime)} erir · kutu %${Math.round(h.indirim*100)} ucuz${h.kazanc>0?` · kazanç ~${tl(kdvli(h.kazanc,u))}`:""}`; })():"";
    return `${oneriTxt?`<p class="hkucuk" style="margin:4px 0">${oneriTxt}</p>`:""}${dep||'<p class="hkucuk" style="margin:4px 0 0">Depolarda fiyat yok.</p>'}`; };

// birden çok eksik ilacı tek seferde depolarda arat; sonuçları ilgili satıra bas
async function sDaCoklu(eksik, orderId){
  if(!(await oturumKontrol())) return;
  let l; try{ l=await sepetListe(); }catch(e){ return; }
  const ids={};
  for(const e of eksik){ const sid="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); ids[e.i]=sid; const bq=String(e.x.bar).replace(/^0(\d{13})$/,"$1"); l.push({ id:sid, tip:"ara", q:bq, durum:"bekliyor", zaman:new Date().toISOString() }); }
  try{ await db.from("ayar").upsert({ anahtar:"sepet_istek", deger:JSON.stringify({ liste:l.slice(-60) }), guncelleme:new Date().toISOString() }, { onConflict:"anahtar" }); }catch(e){ return; }
  const kalan = new Set(eksik.map(e=>e.i));
  for(let t=0; t<40 && kalan.size; t++){
    await new Promise(r=>setTimeout(r, t<20?1500:3000));
    if(!document.getElementById("dara"+eksik[0].i) && ![...kalan].some(i=>document.getElementById("dara"+i))) return;  // ekrandan çıkıldı
    let sonuc=[]; try{ const { data }=await db.from("ayar").select("deger").eq("anahtar","depo_ara_sonuc").maybeSingle(); sonuc = data?(JSON.parse(data.deger).liste||[]):[]; }catch(e){ continue; }
    for(const i of [...kalan]){
      const e = eksik.find(z=>z.i===i); const s = sonuc.find(z=>z.id===ids[i]); if(!s) continue;
      const cont = document.getElementById("dara"+i); if(!cont){ kalan.delete(i); continue; }
      cont.innerHTML = sDaRender(s);
      cont.querySelectorAll("[data-dax]").forEach(b=>b.addEventListener("click", ()=>{ const [k,ii,a,m]=b.dataset.dax.split("|"); const prod=s.depolar[k].u[+ii]; SEPET_ORDER=orderId; sepetAc(k, String(prod.b).replace(/^0(\d{13})$/,"$1"), prod.ad||prod.b, +a, +m); }));
      kalan.delete(i);
    }
  }
  for(const i of kalan){ const cont=document.getElementById("dara"+i); if(cont){ const e=eksik.find(z=>z.i===i); const bq=String(e.x.bar).replace(/^0(\d{13})$/,"$1"); cont.innerHTML=`<p class="hkucuk" style="margin:4px 0 6px">Depo cevabı gelmedi — eczane bilgisayarında Chrome + depo eklentisi açık ve depolar girişli mi?</p><button class="hcip" type="button" data-depara="${kacis(bq)}" data-sip="${orderId}">🔎 Tekrar ara</button>`; const b=cont.querySelector("[data-depara]"); if(b) b.addEventListener("click", ()=>{ SEPET_ORDER=orderId; location.hash="depoara/"+encodeURIComponent(b.dataset.depara); }); } }
}
// depo_ara_sonuc'tan bir ilacın depolardaki fiyat seçeneklerini (tl, PIN'siz) + sepete ekle butonlarını üret
function sDaRender(s){
  const sira = (s.sira&&s.sira.length)?s.sira:Object.keys(s.depolar||{});
  let out="";
  for(const k of sira){ const d=(s.depolar||{})[k]; if(!d || (d.durum && d.durum!=="ok")) continue;
    const u=(d.u||[]); if(!u.length) continue;
    const prod=u[0]; const kd=prod.k!=null?Number(prod.k):10; const tek=mfTaban(prod); const mfSecs=depoSecenekler(prod).filter(o=>o.m>0).slice(0,4);
    if(!(tek>0) && !mfSecs.length) continue;
    const dx=(a,m,n,etiket)=>`<button class="hcip" type="button" style="margin:2px 4px 2px 0${m>0?'':';border-style:dashed'}" data-dax="${k}|0|${a}|${m}">${etiket} → ${tl(n*(1+kd/100))}</button>`;
    const btns=(tek>0?dx(1,0,tek,"MF'siz 1 adet"):"")+mfSecs.map(o=>dx(o.a,o.m||0,o.n,secenekAd(o))).join("");
    out += `<div style="margin-top:6px"><b>${DEPO_AD[k]||k}</b>${prod.s===0?' <span class="hetk kirmizi">stok yok</span>':prod.s===1?' <span class="hetk" style="color:var(--yesil)">stok var</span>':''} <span>${btns}</span></div>`;
  }
  return out || `<p class="hkucuk" style="margin:4px 0">Depolarda bulunamadı.</p>`;
}

// OTOMATIK GELDI: siparis tarihinde/sonrasinda alinmis ilac varsa durum=geldi (alim_son feed'i)
async function sAlimKontrol(){
  const ilac = (S.alimSon&&S.alimSon.ilac)||{}; let degisti=false, geldiVar=false;
  for(const o of S.kayit){
    if(o.durum!=="verildi" && o.durum!=="depoda") continue;
    const sipTarih = (o.tarih||"").slice(0,10);
    const geldi = (o.ilac||[]).some(x=> x.bar && ilac[x.bar] && ilac[x.bar].t && ilac[x.bar].t >= sipTarih);
    if(geldi){ o.durum="geldi"; o.sira=o.sira||{}; o.sira.geldi=new Date().toISOString(); o.geldiGor=false; degisti=true; geldiVar=true; }
  }
  if(degisti) await sKaydet();
  return geldiVar;
}

/* ===================== PUAN (sadakat) — ayar tablosunda JSON, şema değişikliği yok ===================== */
const PUAN_VARSAYILAN_AYAR = {
  config: {
    tiers: [
      { key:"normal", name:"Normal", min:0,     rate:2 },
      { key:"bronz",  name:"Bronz",  min:5000,  rate:4 },
      { key:"gumus",  name:"Gümüş",  min:10000, rate:6 },
      { key:"altin",  name:"Altın",  min:20000, rate:8 }
    ],
    waMode:"web", dormantDays:180, tierWindowGun:365, birthdayGift:100, birthdayGiftTier:"altin"
  }
};
/* Varsayılan WhatsApp şablonları (yedekte waLang varsa o kullanılır) */
const PUAN_SABLON_TR = {
  birthday:"Merhaba {ad} {hitap}, doğum gününüz kutlu olsun! 🎉 Nice sağlıklı ve mutlu yıllara. Sizi aramızda görmek bizi mutlu ediyor. {eczane}",
  birthdayGift:"Merhaba {ad} {hitap}, doğum gününüz kutlu olsun! 🎉 Bu özel gününüze özel, puan hesabınıza {hediye} puan ({hediye} ₺) tanımladık. Afiyetle kullanın. {eczane}",
  dormant:"Merhaba {ad} {hitap}, sizi bir süredir göremedik 🙂 Puan hesabınızda {puan} puan sizi bekliyor. Bekleriz. {eczane}",
  points:"Merhaba {ad} {hitap}, puan hesabınızda {puan} puan ({puan} ₺) bulunuyor. Sağlıklı günler dileriz. {eczane}"
};
const P = { ayar:null, musteri:[], islem:{}, secili:null, ara:"", sekme:"liste", yukluMu:false };

function pTelTemiz(t){ let d=String(t||"").replace(/\D/g,""); if(d.startsWith("90"))return d; if(d.startsWith("0"))return "90"+d.slice(1); if(d.length===10)return "90"+d; return d; }
function pWaAdres(tel,mesaj){ const n=pTelTemiz(tel), m=encodeURIComponent(mesaj||""); return (P.ayar.config.waMode==="wa") ? `https://wa.me/${n}?text=${m}` : `https://web.whatsapp.com/send?phone=${n}&text=${m}`; }
function pSablon(s,d){ return String(s||"").replace(/\{(\w+)\}/g,(_,k)=> d[k]!=null?d[k]:""); }
function pPara(n){ return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"; }
function pPuanStr(n){ return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pHitap(c){ return c.cinsiyet==="k"?"Hanım":(c.cinsiyet==="e"?"Bey":""); }
function pTierObj(key){ return P.ayar.config.tiers.find(t=>t.key===key) || P.ayar.config.tiers[0]; }
function pIslemList(cid){ return P.islem[cid] || []; }
function pBakiye(cid){ return Math.round(pIslemList(cid).reduce((s,x)=>s+Number(x.points||0),0)*100)/100; }
function pHarcama(cid){ const g=Number(P.ayar.config.tierWindowGun||0); const sinir = g>0 ? Date.now()-g*864e5 : 0; return pIslemList(cid).filter(x=>x.type==="earn" && new Date(x.date).getTime()>=sinir).reduce((s,x)=>s+Number(x.spent||0),0); }
function pHarcamaTum(cid){ return pIslemList(cid).filter(x=>x.type==="earn").reduce((s,x)=>s+Number(x.spent||0),0); }
function pOtoTier(cid){ const h=pHarcama(cid); let t=P.ayar.config.tiers[0]; for(const x of P.ayar.config.tiers){ if(h>=x.min) t=x; } return t; }
function pTier(c){ if(c.manualTier){ const m=pTierObj(c.manualTier); if(m) return m; } return pOtoTier(c.id); }
function pSonAktivite(c){ const l=pIslemList(c.id); return l.length? l[l.length-1].date : (c.lastActivity||c.createdAt||new Date().toISOString()); }
function pMDil(c){ return (c && c.dil) ? c.dil : "tr"; }
function pMsgDeger(c){ return { ad:c.ad||"", soyad:c.soyad||"", hitap:pHitap(c), puan:pPuanStr(pBakiye(c.id)), hediye:P.ayar.config.birthdayGift, eczane:(typeof ECZANE_ADI!=="undefined"&&ECZANE_ADI)||"Eczane", seviye:pTier(c).name }; }
function pMsgMetin(cid, tip){ const c=P.musteri.find(x=>x.id===cid); if(!c) return ""; const w=P.ayar.config.waLang&&P.ayar.config.waLang[pMDil(c)]; const s=(w&&w[tip])||PUAN_SABLON_TR[tip]||""; return pSablon(s, pMsgDeger(c)); }

async function puanVeriYukle(){
  try{
    const [a,m,i] = await Promise.all([ayarOku("puan_ayar"), ayarOku("puan_musteri"), ayarOku("puan_islem")]);
    P.ayar = a ? JSON.parse(a.deger) : JSON.parse(JSON.stringify(PUAN_VARSAYILAN_AYAR));
    if(!P.ayar.config) P.ayar.config = JSON.parse(JSON.stringify(PUAN_VARSAYILAN_AYAR.config));
    P.musteri = m ? JSON.parse(m.deger) : [];
    P.islem = i ? JSON.parse(i.deger) : {};
    P.yukluMu = true;
  }catch(e){ P.ayar=P.ayar||JSON.parse(JSON.stringify(PUAN_VARSAYILAN_AYAR)); P.musteri=P.musteri||[]; P.islem=P.islem||{}; }
}
async function pAyarKaydet(){ await ayarYaz("puan_ayar", JSON.stringify(P.ayar)); }
async function pMusteriKaydetBulut(){ await ayarYaz("puan_musteri", JSON.stringify(P.musteri)); }
async function pIslemKaydetBulut(){ await ayarYaz("puan_islem", JSON.stringify(P.islem)); }
function pUuid(){ try{ return crypto.randomUUID(); }catch(e){ return "px-"+Date.now()+"-"+Math.random().toString(36).slice(2,9); } }

async function pKazandir(cid, tutar, oran){
  const c=P.musteri.find(x=>x.id===cid); if(!c) return;
  const puan = Math.round(Number(tutar)*Number(oran)/100*100)/100;
  const tx={ id:pUuid(), customerId:cid, date:new Date().toISOString(), type:"earn", spent:Number(tutar), rate:Number(oran), points:puan, balanceAfter:0 };
  (P.islem[cid] = P.islem[cid]||[]).push(tx);
  c.balance = pBakiye(cid); tx.balanceAfter=c.balance; c.lastActivity=tx.date;
  await Promise.all([pIslemKaydetBulut(), pMusteriKaydetBulut()]);
}
async function pKullan(cid, puan){
  const c=P.musteri.find(x=>x.id===cid); if(!c) return;
  const bak=pBakiye(cid); const kul=Number(puan);
  if(kul>bak+0.001){ alert("Yetersiz puan. Bakiye: "+pPuanStr(bak)); return; }
  const tx={ id:pUuid(), customerId:cid, date:new Date().toISOString(), type:"redeem", spent:null, rate:null, points:-kul, balanceAfter:0 };
  (P.islem[cid] = P.islem[cid]||[]).push(tx);
  c.balance=pBakiye(cid); tx.balanceAfter=c.balance; c.lastActivity=tx.date;
  await Promise.all([pIslemKaydetBulut(), pMusteriKaydetBulut()]);
}
async function pDogumHediye(cid){
  const c=P.musteri.find(x=>x.id===cid); if(!c) return;
  const mik=Number(P.ayar.config.birthdayGift||100);
  const tx={ id:pUuid(), customerId:cid, date:new Date().toISOString(), type:"gift", spent:0, rate:0, points:mik, balanceAfter:0 };
  (P.islem[cid] = P.islem[cid]||[]).push(tx);
  c.balance=pBakiye(cid); tx.balanceAfter=c.balance; c.lastActivity=tx.date;
  await Promise.all([pIslemKaydetBulut(), pMusteriKaydetBulut()]);
}
async function pIslemSil(cid, txid){
  if(!confirm("Bu işlemi geri al? Bakiye yeniden hesaplanır.")) return;
  P.islem[cid] = pIslemList(cid).filter(x=>x.id!==txid);
  const c=P.musteri.find(x=>x.id===cid); if(c) c.balance=pBakiye(cid);
  await Promise.all([pIslemKaydetBulut(), pMusteriKaydetBulut()]);
  pDetay(cid);
}
async function pMusteriSil(cid){
  const c=P.musteri.find(x=>x.id===cid); if(!c) return;
  if(!confirm((c.ad||"")+" "+(c.soyad||"")+" müşterisini ve tüm işlemlerini sil?")) return;
  P.musteri = P.musteri.filter(x=>x.id!==cid); delete P.islem[cid]; P.secili=null;
  await Promise.all([pMusteriKaydetBulut(), pIslemKaydetBulut()]);
  puanSayfasi();
}
function pWaGonder(cid, metin){
  const c=P.musteri.find(x=>x.id===cid); if(!c) return;
  if(!pTelTemiz(c.telefon)){ alert("Bu müşteride telefon kayıtlı değil."); return; }
  window.open(pWaAdres(c.telefon, metin), "_blank");
}

/* ---- Raporlar / doğum günü hesapları ---- */
function pGunFarki(ay,gun){ const now=new Date(); const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()); let d=new Date(now.getFullYear(),ay-1,gun); d.setHours(0,0,0,0); let diff=Math.round((d-t)/864e5); if(diff<0){ d=new Date(now.getFullYear()+1,ay-1,gun); d.setHours(0,0,0,0); diff=Math.round((d-t)/864e5); } return diff; }
function pDogumYaklasan(){ return P.musteri.filter(c=>c.dogumGunu&&c.dogumGunu.gun&&c.dogumGunu.ay).map(c=>({c,gun:pGunFarki(Number(c.dogumGunu.ay),Number(c.dogumGunu.gun))})).filter(x=>x.gun<=7).sort((a,b)=>a.gun-b.gun); }
function pUykuda(){ const g=Number(P.ayar.config.dormantDays||180); const sinir=Date.now()-g*864e5; return P.musteri.filter(c=> new Date(pSonAktivite(c)).getTime()<sinir).map(c=>({c, gun:Math.floor((Date.now()-new Date(pSonAktivite(c)).getTime())/864e5)})).sort((a,b)=>b.gun-a.gun); }
function pEnIyi10(){ return P.musteri.map(c=>({c,h:pHarcamaTum(c.id)})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h).slice(0,10); }
function pHitapEksik(){ return P.musteri.filter(c=>!c.cinsiyet); }
function pSeviyeDusecek(){
  const g=Number(P.ayar.config.tierWindowGun||0); if(!g) return [];
  const ufuk=30, altSinirGelecek=Date.now()+ufuk*864e5-g*864e5, res=[];
  for(const c of P.musteri){
    if(c.manualTier) continue;
    const simdi=pOtoTier(c.id); if(simdi.min<=0) continue;
    const kalan=pIslemList(c.id).filter(x=>x.type==="earn" && new Date(x.date).getTime()>=altSinirGelecek).reduce((s,x)=>s+Number(x.spent||0),0);
    let yeni=P.ayar.config.tiers[0]; for(const x of P.ayar.config.tiers){ if(kalan>=x.min) yeni=x; }
    if(yeni.min<simdi.min) res.push({c, simdi, yeni});
  }
  return res;
}
function pCsvIndir(basliklar, satirlar, dosya){
  const esc=v=>{ v=String(v==null?"":v); return /[";\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const metin=[basliklar.join(";")].concat(satirlar.map(r=>r.map(esc).join(";"))).join("\r\n");
  const blob=new Blob(["﻿"+metin],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=dosya; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function puanSayfasi(){
  $("#puanDugme").classList.add("aktif");
  if(!P.yukluMu){ yukleniyor(); await puanVeriYukle(); }
  const dgSay=pDogumYaklasan().length, bugun=pDogumYaklasan().filter(x=>x.gun===0).length;
  const sek=(k,et)=>`<button type="button" onclick="P.sekme='${k}';puanSayfasi()" style="padding:8px 12px;border:1px solid ${P.sekme===k?'var(--vurgu,#2d6cdf)':'#e9ecef'};border-radius:10px;background:${P.sekme===k?'var(--vurgu,#2d6cdf)':'#f6f7f9'};color:${P.sekme===k?'#fff':'var(--murekkep)'};font-weight:${P.sekme===k?'600':'400'}">${et}</button>`;

  <button class="geri" type="button" onclick="location.hash=''">‹ Ana ekran</button>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px">
    ${sek("liste","👤 Müşteriler")} ${sek("dogum","🎂 Doğum günü"+(dgSay?` (${dgSay})`:"")+(bugun?" 🔴":""))} ${sek("rapor","📊 Raporlar")} ${sek("ayar","⚙️ Ayarlar")}
  </div>
  <div id="puanGovde"></div>`;
  if(P.sekme==="dogum") puanDogumGovde();
  else if(P.sekme==="rapor") puanRaporGovde();
  else if(P.sekme==="ayar") puanAyarGovde();
  else puanListeGovde();
}

  $("#pYeni").onclick=()=>pMusteriForm(null);

/* ---- Yedek ---- */
function pYedekAl(){
  const veri={ app:"eczane-puan", version:2, exportedAt:new Date().toISOString(), settings:P.ayar, customers:P.musteri, transactions:P.islem };
  const blob=new Blob([JSON.stringify(veri,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="eczane-puan-yedek-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function pYedekYukle(e){
  const f=e.target && e.target.files && e.target.files[0]; if(!f) return;
  let d; try{ d=JSON.parse(await f.text()); }catch(err){ alert("Dosya okunamadı."); return; }
  if(!d.customers){ alert("Bu bir Puan yedeği değil."); return; }
  if(!confirm((d.customers.length||0)+" müşteri içe aktarılacak. Mevcut Puan listesinin ÜZERİNE yazılır. Devam?")) return;
  if(d.settings && d.settings.config){ P.ayar=d.settings; if(P.ayar.config.tierWindowGun==null) P.ayar.config.tierWindowGun=365; if(P.ayar.config.dormantDays==null) P.ayar.config.dormantDays=180; }
  else { P.ayar=P.ayar||JSON.parse(JSON.stringify(PUAN_VARSAYILAN_AYAR)); }
  if(!P.ayar.config) P.ayar.config=JSON.parse(JSON.stringify(PUAN_VARSAYILAN_AYAR.config));
  P.musteri = d.customers || [];
  P.islem = d.transactions || {};
  for(const c of P.musteri){ c.balance = pBakiye(c.id); }
  await Promise.all([pAyarKaydet(), pMusteriKaydetBulut(), pIslemKaydetBulut()]);
  if(e.target) e.target.value="";
  alert("İçe aktarıldı: "+P.musteri.length+" müşteri.");
  P.yukluMu=true; P.sekme="liste"; puanSayfasi();
}

let SON_OKUTMA = null;
// GS1 karekod: (01) GTIN 14 · (21) seri · (17) SKT YYMMDD · (10) parti
function karekodCoz(ham){
  let t = String(ham||"").replace(/^\]d2|^\]C1|^\]Q3/,"").replace(/\u001d/g,"\x1d").trim().replace(/^\x1d+/,"");
  if(/^\d{8}$|^\d{12,13}$/.test(t)) return { gtin: t.padStart(14,"0") };          // düz barkod
  if(/^\d{14}$/.test(t)) return { gtin: t };
  const o = {}; let i = 0;
  const degisken = (max) => { let j = t.indexOf("\x1d", i); let son = j<0 ? t.length : j;
    if(j<0){ const m = t.slice(i).search(/(?:17\d{6}(?:10|21)|10[^\x1d]{1,20}$|21[^\x1d]{1,20}$)/); if(m>0 && m<=max) son = i+m; }
    const v = t.slice(i, Math.min(son, i+max)); i = Math.min(son, i+max); if(t[i]==="\x1d") i++; return v; };
  for(let g=0; g<8 && i<t.length; g++){
    const ai = t.slice(i,i+2); i+=2;
    if(ai==="01"){ o.gtin = t.slice(i,i+14); i+=14; }
    else if(ai==="17"){ o.skt = t.slice(i,i+6); i+=6; }
    else if(ai==="21"){ o.seri = degisken(20); }
    else if(ai==="10"){ o.parti = degisken(20); }
    else break;
  }
  if(o.skt){ const [y,m,d] = [o.skt.slice(0,2),o.skt.slice(2,4),o.skt.slice(4,6)]; const gun = d==="00" ? new Date(2000+ +y, +m, 0).getDate() : +d;
    o.miad = `20${y}-${m}-${String(gun).padStart(2,"0")}`; }
  return o.gtin ? o : null;
}
function okutmaBandi(barkod){
  const o = SON_OKUTMA; if(!o || o.barkod!==barkod || Date.now()-o.zaman>10*60e3) return "";
  if(!o.miad && !o.parti) return "";
  const g = o.miad ? gunFarki(o.miad) : null;
  return `<div class="okutma ${o.miad?miadSinifi(o.miad):""}">📷 <b>Okutulan kutu</b> · ${o.miad?`Miad <b>${tarih(o.miad)}</b>${g!=null?` (${g<0?"GEÇMİŞ":g<60?g+" gün":Math.round(g/30)+" ay"})`:""}`:""}${o.parti?` · Parti ${kacis(o.parti)}`:""}</div>`;
}
